schema_version = 2
description = "The deliberately small 1.0 SemVer surface. Every callable/class signature is locked below; all other exports remain non-stable."

[packages.hedron]
symbols = [
  "__version__",
  "CsrfField",
  "CsrfStrategy",
  "DoubleSubmitCookieCsrf",
  "Form",
  "FormErrors",
  "FormField",
  "FragmentRegion",
  "Hedron",
  "HedronRouter",
  "Hx",
  "Label",
  "Page",
  "Poll",
  "RefreshButton",
  "SecurityHeadersPolicy",
  "SecurityPolicy",
  "SessionTokenCsrf",
  "Stack",
  "SubmitButton",
  "Text",
  "TextArea",
  "TextInput",
  "html",
  "redirect_htmx",
  "retarget",
  "swap",
  "swap_oob",
]

[packages.hedron.signatures]
CsrfField = '''(*, name: 'str | None' = None, token: 'str | None' = None, provider: 'CsrfTokenProvider | None' = None, **kwargs: 'object') -> 'None' '''
CsrfStrategy = '''(*args, **kwargs)'''
DoubleSubmitCookieCsrf = '''(cookie_name: 'str' = 'hedron_csrf', form_field: 'str' = 'csrf_token', header_name: 'str' = 'X-CSRF-Token', sets_cookie: 'bool' = True) -> None'''
Form = '''(*nodes: 'NodeLike', children: 'NodeLike' = None, action: 'SafeUrl | str | object | None' = None, method: "Literal['get', 'post']" = 'post', hx: 'Hx | None' = None, **kwargs: 'HtmlAttrValue') -> 'None' '''
FormErrors = '''(errors: 'Sequence[str]', **kwargs: 'object') -> 'None' '''
FormField = '''(*, name: 'str', label: 'str', control: 'NodeLike', id: 'str | None' = None, help: 'str | None' = None, required: 'bool' = False, error: 'str | None' = None, **kwargs: 'object') -> 'None' '''
FragmentRegion = '''(id: 'str', selector: 'str', description: 'str' = '') -> None'''
Hedron = '''(*args: 'Any', security: 'SecurityProfileName | str | SecurityPolicy' = 'standard', explorer: 'ExplorerMode | str | None' = None, session_secret: 'str | None' = 'hedron-dev-secret-change-me', enable_sessions: 'bool' = True, explorer_dependencies: 'Sequence[DependsParam] | None' = None, theme: 'str | Theme | DesignSystem | None' = 'default', default_styles: 'bool' = True, demand_driven_assets: 'bool' = False, build_dir: 'str | Path | None' = None, production: 'bool | None' = None, root_path: 'str | None' = None, bootstrap_steps: 'Sequence[HedronBootstrapStep] | None' = None, cache_backend: 'CacheBackend | None' = None, job_backend: 'JobBackend | None' = None, concurrency_config: 'ConcurrencyConfig | None' = None, tracing_config: 'TraceConfig | None' = None, **kwargs: 'Any') -> 'None' '''
HedronRouter = '''(*args: 'Any', provenance: 'str' = '', **kwargs: 'Any') -> 'None' '''
Hx = '''(target: 'str | None' = None, swap: 'str | None' = <factory>, select: 'str | None' = None, select_oob: 'str | None' = None, push_url: 'bool | str' = False, disabled_elt: 'str | None' = None, indicator: 'str | None' = None, method: "Literal['get', 'post', 'put', 'patch', 'delete'] | None" = None, url: 'str | None' = None, preload: 'str | None' = None, trigger: 'str | None' = None, include: 'str | None' = None, validate: "Literal['native'] | bool | None" = None, vals: 'str | None' = None, headers: 'str | None' = None, busy: "Literal['region', 'document'] | None" = None, sync: 'str | None' = None, confirm: 'str | None' = None, extension: "Literal['sse', 'preload', 'head-support', 'hedron'] | None" = None) -> None'''
Label = '''(text: 'str', *, for_: 'str | None' = None, **kwargs: 'object') -> 'None' '''
Page = '''(*body: 'NodeLike', lang: 'str' = 'en', title: 'str | None' = None, head: 'NodeLike' = None, children: 'NodeLike' = None, data_theme: 'str | None' = None, data_hedron_theme: 'str | None' = None, dir: 'str | None' = None, scripts: 'Sequence[SafeUrl] | None' = None, script_defer: 'bool' = True, script_async: 'bool' = False, htmx_extensions: 'object' = None, **kwargs: 'object') -> 'None' '''
Poll = '''(*, ref: 'ComponentRef', interval_ms: 'int' = 5000, target_id: 'str | None' = None, content: 'NodeLike | None' = None) -> 'None' '''
RefreshButton = '''(label: 'str' = 'Refresh', *, ref: 'ComponentRef | None' = None, href: 'str | None' = None, target: 'str | None' = None, swap: 'str' = 'outerHTML') -> 'None' '''
SecurityHeadersPolicy = '''(content_security_policy: 'str | None' = None, frame_options: 'str | None' = None, content_type_options: 'str | None' = None, referrer_policy: 'str | None' = None, hsts_max_age: 'int | None' = None) -> None'''
SecurityPolicy = '''(profile: 'SecurityProfile' = <SecurityProfile.STANDARD: 'standard'>, version: 'int' = 1, csrf_enabled: 'bool' = True, csrf_cookie_name: 'str' = 'hedron_csrf', csrf_header_name: 'str' = 'X-CSRF-Token', csrf_form_field: 'str' = 'csrf_token', csrf: 'CsrfStrategy | None' = None, private_authenticated_cache: 'bool' = True, security_headers: 'SecurityHeadersMode | SecurityHeadersPolicy' = True, content_security_policy: 'str | None' = None, frame_options: 'str' = 'DENY', content_type_options: 'str' = 'nosniff', referrer_policy: 'str' = 'no-referrer', explorer_enabled: 'bool' = False, allow_external_redirects: 'bool' = False, htmx_browser_preset: 'bool' = True, allow_htmx_eval: 'bool' = False, findings: 'tuple[str, ...]' = <factory>, control_plane_version: 'int' = 1, conformance_profile_version: 'str' = 'hedron-security-1', intent_required: 'bool' = False, posture_strict: 'bool' = False, request_budget_limits: 'RequestBudgetLimits | None' = None, egress_allow_hosts: 'frozenset[str]' = <factory>, egress_deny_by_default: 'bool' = True) -> None'''
SessionTokenCsrf = '''(get_expected: 'Callable[[object], str | None]', form_field: 'str' = 'csrf_token', header_name: 'str' = 'X-CSRF-Token', sets_cookie: 'bool' = False, cookie_name: 'str' = '') -> None'''
Stack = '''(*nodes: 'NodeLike', children: 'NodeLike' = None, gap: 'str' = '1rem', id: 'str | None' = None, class_: 'str | None' = None, **kwargs: 'Any') -> 'None' '''
SubmitButton = '''(label: 'str' = 'Submit', *, disabled: 'bool' = False, class_: 'str | None' = None, **kwargs: 'object') -> 'None' '''
Text = '''(content: 'str' = '', *, as_: "Literal['p', 'span', 'strong', 'em', 'small']" = 'p', role: 'TypographyRole | None' = None, overflow: 'OverflowMode | None' = None, lines: 'int | None' = None, measure: 'TypographyMeasure | None' = None, effect: 'TypographyEffect | None' = None, tracking: 'str | None' = None, wrap: 'str | None' = None, class_: 'str | None' = None, **kwargs: 'object') -> 'None' '''
TextArea = '''(name: 'str', *, id: 'str | None' = None, value: 'str' = '', rows: 'int' = 4, required: 'bool' = False, placeholder: 'str | None' = None, aria_describedby: 'str | None' = None, aria_invalid: 'str | None' = None, aria_required: 'str | None' = None, class_: 'str | None' = None, enhance: "Literal['legacy', 'native', 'alpine']" = 'legacy', **kwargs: 'object') -> 'None' '''
TextInput = '''(name: 'str', *, id: 'str | None' = None, value: 'str' = '', placeholder: 'str | None' = None, required: 'bool' = False, type: "Literal['text', 'email', 'password', 'search', 'tel', 'url']" = 'text', autocomplete: 'str | None' = None, disabled: 'bool' = False, aria_describedby: 'str | None' = None, aria_invalid: 'str | None' = None, aria_required: 'str | None' = None, class_: 'str | None' = None, enhance: "Literal['legacy', 'native', 'alpine']" = 'legacy', **kwargs: 'object') -> 'None' '''
redirect_htmx = '''(url: 'str') -> 'InteractionResult' '''
retarget = '''(content: 'NodeLike | None', region: 'FragmentRegion | str', **kwargs: 'Any') -> 'InteractionResult' '''
swap = '''(content: 'NodeLike | None', *, toast: 'str | NodeLike | OobUpdate | None' = None, oob: 'Sequence[OobUpdate | NodeLike]' = (), **kwargs: 'Any') -> 'InteractionResult' '''
swap_oob = '''(content: 'NodeLike | None', *oob: 'OobUpdate | NodeLike', **kwargs: 'Any') -> 'InteractionResult' '''

[packages.hedron-core]
symbols = [
  "Component",
  "Page",
  "Text",
  "render",
  "RenderMode",
  "RenderContext",
  "RenderResult",
  "SafeUrl",
  "TrustedHtml",
  "Secret",
  "FragmentRegion",
  "InteractionResult",
]

[packages.hedron-core.signatures]
Component = '''(props: 'PropsT | None' = None, /, **kwargs: 'object') -> 'None' '''
Page = '''(*body: 'NodeLike', lang: 'str' = 'en', title: 'str | None' = None, head: 'NodeLike' = None, children: 'NodeLike' = None, data_theme: 'str | None' = None, data_hedron_theme: 'str | None' = None, dir: 'str | None' = None, scripts: 'Sequence[SafeUrl] | None' = None, script_defer: 'bool' = True, script_async: 'bool' = False, htmx_extensions: 'object' = None, **kwargs: 'object') -> 'None' '''
Text = '''(content: 'str' = '', *, as_: "Literal['p', 'span', 'strong', 'em', 'small']" = 'p', role: 'TypographyRole | None' = None, overflow: 'OverflowMode | None' = None, lines: 'int | None' = None, measure: 'TypographyMeasure | None' = None, effect: 'TypographyEffect | None' = None, tracking: 'str | None' = None, wrap: 'str | None' = None, class_: 'str | None' = None, **kwargs: 'object') -> 'None' '''
render = '''(value: 'NodeLike', *, context: 'RenderContext | None' = None, mode: 'RenderMode' = <RenderMode.FRAGMENT: 'fragment'>) -> 'RenderResult' '''
RenderContext = '''(locale: 'str' = 'en', theme: 'str | None' = None, max_depth: 'int' = 100, max_nodes: 'int' = 50000, csrf_token: 'str | None' = None, csrf_form_field: 'str' = 'csrf_token', mount_path: 'str' = '') -> None'''
RenderResult = '''(html: 'str', mode: 'RenderMode', assets: 'tuple[AssetRef, ...]' = (), headers: 'Mapping[str, str]' = <factory>, identity_map: 'Mapping[str, str]' = <factory>, diagnostics: 'tuple[Diagnostic, ...]' = (), trace: 'RenderTrace | Mapping[str, object] | None' = None, htmx_plan: 'object | None' = None, browser_plan: 'BrowserFeaturePlan' = <factory>, requires_htmx: 'bool' = False) -> None'''
SafeUrl = '''(*args: 'object', **kwargs: 'object') -> 'None' '''
TrustedHtml = '''(*args: 'object', **kwargs: 'object') -> 'None' '''
Secret = '''(value: 'T') -> 'None' '''
FragmentRegion = '''(id: 'str', selector: 'str', description: 'str' = '') -> None'''
InteractionResult = '''(content: 'NodeLike | None' = None, status_code: 'int' = 200, target: 'str | None' = None, swap: 'str | None' = None, oob: 'tuple[OobUpdate, ...]' = (), trigger: 'str | Mapping[str, JsonValue] | None' = None, trigger_after_swap: 'str | Mapping[str, JsonValue] | None' = None, trigger_after_settle: 'str | Mapping[str, JsonValue] | None' = None, push_url: 'str | bool | None' = None, replace_url: 'str | bool | None' = None, redirect: 'str | None' = None, refresh: 'bool' = False, retarget: 'str | None' = None, reswap: 'str | None' = None, reselect: 'str | None' = None, location: 'str | HxLocation | Mapping[str, JsonValue] | None' = None, history: 'HistoryMode' = 'none', cache: 'CacheHint | None' = 'vary-htmx', concurrency: 'str | None' = None, action_state: 'ActionState | None' = None, action_trace: 'ActionTrace | None' = None, region_id: 'str | None' = None, policy: 'InteractionPolicy | None' = None, headers: 'Mapping[str, str]' = <factory>, explanation: 'str' = '', select_oob: 'str | None' = None) -> None'''
