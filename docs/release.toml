[release]
# Public release facts. Adopter-facing "current", "living", and install-pin claims
# must agree with this file. The workspace is aligned with the published train.
train = "0.60"
published_version = "0.60.0"
development_version = "0.60.0"
published_date = "2026-08-22"
pin_floor = "0.60.0"
pin_ceiling = "0.61"
previous_train = "0.59"
previous_version = "0.59.0"
previous_security_until = "2027-08-20"
# Latest version actually on PyPI. Keep in sync with pypi.org (not workspace version).
# When registry_status is "deferred", first-run copy-paste must use the public-index
# pin rather than an unpublished in-tree pin. When "uploaded", pypi_version must equal
# published_version and first-run commands use the same pin as Installation.
pypi_version = "0.60.0"
pypi_pin_floor = "0.60.0"
pypi_pin_ceiling = "0.61"
registry_status = "uploaded"

[satellites]
minimum_version = "0.2.0"
maximum_version = "0.3"
charts_minimum_version = "0.2.0"
charts_maximum_version = "0.3"

[documentation]
canonical_install_page = "getting-started/installation.md"
canonical_release_page = "guides/release-notes.md"
canonical_maturity_page = "guides/whats-ready.md"
canonical_upgrade_page = "guides/upgrade.md"
