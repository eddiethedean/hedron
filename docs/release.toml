[release]
# Public release facts. Adopter-facing "current", "living", and install-pin claims
# must agree with this file. The workspace may be preparing a later patch.
train = "0.50"
published_version = "0.50.1"
development_version = "0.50.1"
published_date = "2026-08-18"
pin_floor = "0.50.1"
pin_ceiling = "0.51"
previous_train = "0.49"
previous_version = "0.49.1"
previous_security_until = "2027-08-17"
# Latest version actually on PyPI. Keep in sync with pypi.org (not workspace version).
# When registry_status is "deferred", first-run docs must say so and may pin this
# version; in-tree train pins remain allowed.
pypi_version = "0.48.0"
pypi_pin_floor = "0.48.0"
pypi_pin_ceiling = "0.49"
registry_status = "deferred"

[satellites]
minimum_version = "0.1.10"
maximum_version = "0.2"
charts_minimum_version = "0.2.0"
charts_maximum_version = "0.3"

[documentation]
canonical_install_page = "getting-started/installation.md"
canonical_release_page = "guides/release-notes.md"
canonical_maturity_page = "guides/whats-ready.md"
canonical_upgrade_page = "guides/upgrade.md"
