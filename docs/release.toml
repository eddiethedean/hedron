[release]
# Public release facts. Adopter-facing "current", "living", and install-pin claims
# must agree with this file. The workspace may be preparing a later release.
# Stable release channel. The workspace is preparing this cut; it is not yet
# tagged or published.
train = "1.0"
published_version = "1.0.0"
stable_version = "1.0.0"
# Beta preview channel; intentionally separate from the stable package metadata.
beta_version = "0.67.0"
development_version = "1.0.0"
published_date = ""
pin_floor = "1.0.0"
pin_ceiling = "1.1"
previous_train = "0.67"
previous_version = "0.67.0"
previous_security_until = "2027-02-27"
# Latest version actually on PyPI. Keep in sync with pypi.org (not workspace version).
# When "deferred", pypi_version is the latest registry-resolvable fallback;
# first-run commands must use that fallback rather than the in-tree candidate.
pypi_version = "0.67.0"
pypi_pin_floor = "0.67.0"
pypi_pin_ceiling = "0.68"
registry_status = "deferred"

[edron]
# Edron is released in lockstep with the Hedron 1.0 documentation contract.
published_version = "1.0.0"
development_version = "1.0.0"
pin_floor = "1.0.0"
pin_ceiling = "1.1"
pypi_version = "0.9.0"
pypi_pin_floor = "0.9.0"
pypi_pin_ceiling = "0.10"
registry_status = "deferred"

[satellites]
minimum_version = "0.2.3"
maximum_version = "0.3"
charts_minimum_version = "1.0.0"
charts_maximum_version = "2.0"

[runtimes]
# The tooling-grade cross-language evaluators release independently from the
# coordinated Python workspace train.
node_version = "0.66.2"
java_version = "0.66.2"

[documentation]
canonical_install_page = "getting-started/installation.md"
canonical_release_page = "guides/release-notes.md"
canonical_maturity_page = "guides/whats-ready.md"
canonical_upgrade_page = "guides/upgrade.md"
