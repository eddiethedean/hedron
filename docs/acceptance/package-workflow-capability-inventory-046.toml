[[exclusion]]
id = "PW-EX-001"
summary = "No package workflow executor, hidden reactivity, global store, signal system, or full-script rerun."

[[exclusion]]
id = "PW-EX-002"
summary = "No universal CRUD, ORM/source discovery, inferred authz/tenancy/transactions/idempotency/retries, or automatic destructive action."

[[exclusion]]
id = "PW-EX-003"
summary = "No automatic MCP/Gradio/public exposure, user-supplied remote origin, ambient credentials, or trusted remote schema."

[[exclusion]]
id = "PW-EX-004"
summary = "No opaque Explorer production workflow store or unreviewed generated code/test authority."

[[exclusion]]
id = "PW-EX-005"
summary = "No required custom elements, Node/browser framework/live transport/type-checker plugin or blanket package maturity promotion."

