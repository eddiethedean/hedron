[[feature_inventory]]
id = "data-workspace"
package = "hedron-data"
initial_scope = ["list", "detail", "create", "edit", "validation", "forbidden", "not_found", "conflict"]
excluded = ["automatic_delete", "bulk_mutation", "relation_discovery", "nested_write", "inferred_authz"]
gate = "DATAFLOW-046"

[[feature_inventory]]
id = "chart-interaction"
package = "hedron-charts"
initial_scope = ["select", "inspect", "focus", "reset", "deterministic_export_command", "linked_refresh"]
excluded = ["hidden_dependency", "arbitrary_callback", "automatic_crossfilter", "adapter_promotion", "legend_filter_supported_without_host_a11y", "brush_supported_without_host_a11y", "drill_intent_supported_without_host_a11y"]
gate = "VISUAL-046"

[[feature_inventory]]
id = "schema-aware-elements"
package = "hedron-elements"
initial_scope = ["supported_control_map", "typed_events", "async_command_state", "native_fallback"]
excluded = ["arbitrary_schema", "browser_authority", "required_javascript", "react_promotion"]
gate = "ELEMENT-046"

[[feature_inventory]]
id = "mcp-exposure"
package = "hedron-mcp"
initial_scope = ["explicit_resource", "explicit_tool", "confirmation", "authz", "audit"]
excluded = ["automatic_exposure", "dom_authority", "ambient_principal", "unbounded_output"]
gate = "REMOTE-046"

[[feature_inventory]]
id = "gradio-remote-workflow"
package = "hedron-gradio"
initial_scope = ["allowlisted_endpoint", "local_models", "files", "progress", "typed_outcomes"]
excluded = ["ui_embedding", "user_url", "ambient_credentials", "trusted_remote_schema"]
gate = "REMOTE-046"

[[feature_inventory]]
id = "workflow-workbench"
package = "hedron-explorer"
initial_scope = ["inspect", "preview", "outcome_matrix", "effect_coverage", "reviewable_generation"]
excluded = ["production_workflow_store", "direct_handler_call", "opaque_format"]
gate = "WORKBENCH-046"

