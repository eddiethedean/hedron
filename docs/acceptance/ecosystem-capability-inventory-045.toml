[[capability]]
id = "EC-QUAL-007..008"
area = "performance"
gate = "PERF-045"
state = "Planned"
packages = ["hedron-core", "hedron", "hedron-explorer"]
evidence = ["compile", "lookup", "manifest", "startup", "allocation", "memory"]
