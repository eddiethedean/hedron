[[capability]]
id = "EC-DEPLOY-001..007"
area = "deployment"
gate = "DEPLOY-045"
secondary_gates = ["SECURITY-045", "COMPAT-045"]
state = "Planned"
packages = ["hedron-posit", "hedron-workbench", "fastapi-workbench", "hedron"]
evidence = ["workbench", "connect", "mount", "multi-worker", "rollback"]
summary = "Deployment adapters validate catalog artifacts and mount-aware diagnostics without moving Hedron semantics into generic fastapi-workbench."

[[capability]]
id = "EC-SEC-001..010"
area = "security-and-privacy"
gate = "SECURITY-045"
secondary_gates = ["REGRESS-045"]
state = "Planned"
packages = ["hedron-core", "hedron", "hedron-explorer", "hedron-mcp", "hedron-gradio"]
evidence = ["threat-model", "redaction", "hostile-json", "provider-trust", "review"]
summary = "Catalogs, manifests, projections, providers, tools, and remote adapters are bounded untrusted inputs with strict redaction and no capability/exposure semantics."

[[capability]]
