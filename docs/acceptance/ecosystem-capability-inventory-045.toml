# Phase 0.45 typed interaction ecosystem capability inventory.
# Stage 0 contract artifact: capabilities are Planned until their owning gate is Verified.

schema_version = 1
phase = "0.45"
status = "Planned"
planning_baseline = "v0.42.0"
required_predecessor = "v0.44.0"
target = "v0.45.0"
decision = "D-074"
owning_rfc = "RFC-0072"
implementation = "docs/implementation/TYPED_INTERACTION_ECOSYSTEM_045.md"
public_contract = "docs/api/INTERACTION_CATALOG.md"

[[capability]]
id = "EC-CAT-001..010"
area = "catalog"
gate = "CATALOG-045"
secondary_gates = ["SECURITY-045", "COMPAT-045"]
state = "Planned"
packages = ["hedron-core", "hedron"]
evidence = ["unit", "integration", "determinism", "concurrency", "golden"]
summary = "One sealed read-only catalog indexes authoritative 0.43 descriptors and optional matching 0.44 type extensions without executing or reinterpreting them."

[[capability]]
id = "EC-MAN-001..010"
area = "manifest"
gate = "MANIFEST-045"
secondary_gates = ["SECURITY-045", "DEPLOY-045"]
state = "Planned"
packages = ["hedron-core", "hedron"]
evidence = ["json-schema", "byte-golden", "build", "startup", "adversarial"]
summary = "Versioned deterministic redacted manifests support trusted build, static reads, bounded parsing, compatibility, fingerprint validation, and atomic deployment."

[[capability]]
id = "EC-PROJ-001..010"
area = "package-projections"
gate = "PROJECTION-045"
secondary_gates = ["SECURITY-045", "PKG-045"]
state = "Planned"
packages = ["hedron-core", "hedron", "hedron-sample-kit"]
evidence = ["provider", "namespace", "version-skew", "optional-dependency", "rollback"]
summary = "Namespaced bounded projections attach package metadata and limitations to catalog fingerprints without runtime, policy, exposure, or mutation authority."

[[capability]]
id = "EC-HOST-001..008"
area = "host-adapters"
gate = "HOST-045"
secondary_gates = ["COMPAT-045"]
state = "Planned"
packages = ["hedron", "hedron-flask", "hedron-django", "hedron-conformance"]
evidence = ["fastapi", "flask", "django", "asgi", "wsgi", "no-js"]
summary = "FastAPI, Flask, and Django agree on portable catalog facts while preserving public host-native routing, security, and explicit capability limitations."

[[capability]]
id = "EC-AUTHOR-001..008"
area = "authoring-and-plugins"
gate = "AUTHOR-045"
secondary_gates = ["TOOLING-045", "DOCS-045"]
state = "Planned"
packages = ["hedron", "hedron-jinja", "hedron-sample-kit"]
evidence = ["jinja", "plugin", "scaffold", "diagnostics", "uninstall"]
summary = "Jinja and third-party-shaped plugins consume registered handles and public catalog projections without raw manifest execution or privileged registry access."

[[capability]]
id = "EC-SURFACE-001..008"
area = "surface-packages"
gate = "SURFACE-045"
secondary_gates = ["PKG-045"]
state = "Planned"
packages = ["hedron-data", "hedron-charts", "hedron-elements", "hedron-extras"]
evidence = ["projection", "coexistence", "direct-api", "optional-absence"]
summary = "Current data, chart, element, and extras surfaces attach honest package projections and consume handles without pre-implementing 0.46 workflow features."

[[capability]]
id = "EC-REMOTE-001..008"
area = "remote-projections"
gate = "REMOTE-045"
secondary_gates = ["SECURITY-045"]
state = "Planned"
packages = ["hedron-mcp", "hedron-gradio", "hedron"]
evidence = ["deny-default", "authz", "egress", "files", "audit", "rollback"]
summary = "MCP and Gradio consume safe catalog facts only through separate explicit allowlisted authorization and egress policies; catalog registration never exposes an operation."

[[capability]]
id = "EC-TOOL-001..010"
area = "tooling"
gate = "TOOLING-045"
secondary_gates = ["SECURITY-045", "DOCS-045"]
state = "Planned"
