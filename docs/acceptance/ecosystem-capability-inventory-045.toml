evidence = ["explorer", "cli", "openapi", "scenario", "static-no-exec"]
summary = "Explorer, CLI, OpenAPI, diagnostics, build, and AppScenario use the same catalog/manifest contract with honest trusted/static modes."

[[capability]]
id = "EC-PORT-001..009"
area = "portable-development-tooling"
gate = "PORTABLE-045"
secondary_gates = ["COMPAT-045", "PKG-045"]
