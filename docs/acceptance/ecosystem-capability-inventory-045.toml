[[exclusion]]
id = "EC-EX-001"
summary = "No third runtime/schema authority, route engine, form engine, validation engine, response converter, or reactive graph."

[[exclusion]]
id = "EC-EX-002"
summary = "No automatic MCP, Gradio, HTTP, plugin, or deployment exposure from registration or catalog presence."

[[exclusion]]
id = "EC-EX-003"
summary = "No target-project import, annotation evaluation, plugin loading, or remote discovery in static mode."

[[exclusion]]
id = "EC-EX-004"
summary = "No 0.46 package feature bundles, data workspaces, linked charts, or remote workflows implemented early."

[[exclusion]]
id = "EC-EX-005"
summary = "No dependency inversion, mandatory optional package, Node requirement, maturity promotion, SR-021 closure, or 1.0 scheduling."

