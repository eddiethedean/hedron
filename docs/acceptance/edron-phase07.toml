state = "Implemented"
evidence = "opt-in codemod preview/diff, idempotency, formatting/import/comment preservation, provenance, and unsafe-pattern refusal fixtures"

[[gate]]
id = "EDR-07-REPORT"
state = "Implemented"
evidence = "deterministic bounded redacted text/JSON/SARIF reports, schema negotiation, threshold exit codes, and injection fixtures"

[[gate]]
id = "EDR-07-EXAMPLES"
state = "Implemented"
evidence = "side-by-side Streamlit/Edron/native examples with outcome, HTTP, accessibility, no-JavaScript, and cutover evidence"

[[gate]]
id = "EDR-07-REGRESSION"
