[[surface]]
id = "django"
package = "hedron-django"
disposition = "bounded_exception"
owner = "hedron-django"
reason = "No FastAPI dependency injection; do not emulate a parallel DI solver."
destination = "portable TypeSchema/result consumption or labeled exception"

[[surface]]
id = "jinja"
package = "hedron-jinja"
disposition = "bounded_exception"
owner = "hedron-jinja"
reason = "Templates must not evaluate annotations."
destination = "explicit access to registered form/handle schema components"
notes = "native_consumer only for already-registered schema/handle bridges; annotation evaluation is refused."
