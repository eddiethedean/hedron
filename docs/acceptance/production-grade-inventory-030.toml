# Phase 0.30 production-grade inventory (machine-checked at PKG-030 cut).
# Supported = production-grade label at 0.30 exit for the declared package only.
# Experimental = may ship but excluded from production-grade claims.
# Excluded = must not be required for a production-grade Supported workflow.
# Owning decision: D-058. RFC: RFC-0063.

baseline = "v0.29.0"
packages = [
  "fastapi-workbench",
  "hedron-workbench",
]

[fastapi-workbench]
supported = [
  "pure_resolver",
  "workbench_config",
  "workbench_mode_auto_on_off",
  "single_normalizer",
  "pre_import_launcher",
  "fastapi_workbench_root_path_export",
  "workbenchify_wrap_once",
  "path_middleware_http_websocket",
  "proxy_port_mount",
  "session_project_mount",
  "rserver_url_path_and_full_url",
  "loopback_single_worker",
  "ordinary_local_uvicorn_noop",
  "generic_asgi_root_path",
  "explicit_mount_without_asgi_root_path",
  "exact_proxy_trust_allowlist",
  "bounded_discovery_output",
  "check_dry_run_text_json",
  "fastapi_workbench_cli",
  "redacted_diagnostics",
  "fastapi_url_redirect_static_openapi",
  "fastapi_run_and_factory",
]
experimental = [
  "posit_connect_base_header",
  "open_browser",
]
excluded = [
  "builtin_runner_reload",
  "builtin_runner_multi_worker",
  "flask_django_wsgi",
  "hedron_dependency",
  "import_auto_activation",
  "rs_server_url_as_trust",
  "bundle_rserver_url",
  "alembic_migrations",
  "fluxlit_public_base_url",
  "connect_publishing",
  "identity_from_workbench_auth",
  "hedron_facade",
  "hedron_cookie_repair",
]

[hedron-workbench]
supported = [
  "hedron_workbench_facade",
  "inactive_hedron_parity",
  "resolved_launcher_handoff",
  "fastapi_workbench_delegation",
  "hedron_root_path_export",
  "cookie_path_at_construction",
  "owned_cookie_path_repair",
  "hedron_redirect_url_composition",
  "hedron_workbench_cli",
]
experimental = [
  "posit_connect_base_header",
]
excluded = [
  "duplicate_generic_resolver",
  "duplicate_generic_middleware",
  "duplicate_generic_runner",
  "flask_django_wsgi",
  "vendor_fastapi_workbench",
  "import_auto_activation",
  "bundle_rserver_url",
  "connect_publishing",
  "identity_from_workbench_auth",
  "plain_fastapi_without_fastapi_workbench",
]

[install_guards]
workbench_import_does_not_wrap = true
fastapi_workbench_import_does_not_wrap = true
inactive_facade_matches_hedron = true
rs_server_url_does_not_activate = true
flask_django_untouched = true
reload_not_default = true
multi_worker_not_default = true
connect_header_not_default_trust = true
fastapi_workbench_has_no_hedron_import = true
hedron_workbench_declares_fastapi_workbench = true

[docs_anchors]
stability = "docs/api/STABILITY.md"
compatibility = "docs/COMPATIBILITY.md"
whats_ready = "docs/guides/whats-ready.md"
workbench_package = "docs/packages/hedron-workbench.md"
workbench_guide = "docs/guides/posit-workbench.md"
mount_api = "docs/api/MOUNT.md"
rfc = "docs/rfcs/RFC-0063-FASTAPI-WORKBENCH-EXTRACTION.md"
fastapi_workbench_readme = "packages/fastapi-workbench/README.md"

[realwb]
image = "posit/workbench:2026.07.0"
image_digest = "sha256:d10ee76a840e8af054d54506ed4b54bc27ee7344ee09d8c99541cd23f39b8c32"
platform = "linux/amd64"
minimum_image = "posit/workbench:2025.05.1"
minimum_image_digest = "sha256:2b017722bef663940d345178d14d196d8716b37d9cf8a52d3da7caba477e7d23"
minimum_platform = "linux/amd64"
license_env = "PWB_LICENSE"
license_container_env = "PWB_LICENSE"
license_stop_timeout_seconds = 120
