# Phase 0.42 Supported element inventory (STABLE-042 artifact)
# Verified at cut. Living published baseline for phase: v0.41.0. Cut: Hedron v0.42.0.
# Owning decision: D-070. RFC: RFC-0060. Tracking #97.
# At Stage 0, supported tags are locked as Planned; evidence lands at cut.

schema = 1
phase = "0.42"
state = "verified"
living_published_baseline = "v0.41.0"
hedron_cut = "v0.42.0"
owning_decision = "D-070"
owning_rfc = "RFC-0060"
tracking = "#97"
browser_floor = "playwright_chromium_firefox_webkit"
browser_floor_source = "tests/browser/test_browser_matrix.py"

supported_tags = [
  "hedron-example",
  "hedron-field-text",
  "hedron-field-choice",
  "hedron-field-file",
  "hedron-disclosure",
  "hedron-dialog",
  "hedron-action-async",
  "hedron-data-editor",
]

[cross_referenced]
# Published chart workflow; do not re-cut hedron-charts in 0.42.
hedron_chart = { package = "hedron-charts", pin = ">=0.2.0,<0.3", disposition = "cross_reference" }

[element_state_ownership]
supported = ["controlled", "local", "draft", "preference"]
experimental = []
excluded = ["ambient_global_store"]

[interaction_state]
supported = ["idle", "pending", "success", "error", "canceled"]
experimental = []
excluded = []

[optimistic_mutation]
supported = ["bounded_dataeditor_collection_cell_edits"]
experimental = []
excluded = [
  "auth",
  "irreversible_destruction",
  "payments",
  "secrets",
  "file_publication",
  "cross_tenant_moves",
]

[gesture_overlay_catalog]
supported = [
  "disclosure",
  "dialog",
  "tabs",
  "menu_popover",
  "selection",
  "bounded_upload",
]
experimental = []
excluded = []

[react_migration_bridge]
disposition = "experimental"
in_hedron_elements = false
supported_default = false
removal_ledger = "REACT_MIGRATION_MATRIX_040.md"

[experimental_or_excluded]
specialty_ui = ["CodeEditor", "TerminalView", "device_capture"]
vendor_chart_adapters = ["plotly", "altair", "echarts", "chartjs", "bokeh", "holoviews", "hvplot", "pygal"]
live_transports = ["sse", "websocket", "streaming", "preload"]
other = [
  "arbitrary_remote_modules",
  "private_shadow_dom_customization",
  "npm_bundler_required_for_python_apps",
  "spa_framework_claim",
  "wrap_all_components_as_custom_elements",
]

[npm_mirror]
package = "@hedron/elements"
modules_and_types_only = true
react_runtime = false
application_bundler_required = false
python_no_node = true

[package_maturity_at_cut]
hedron_elements = "beta"
production_grade_for = "declared_supported_inventory_only"
pin = ">=0.42.0,<0.43"
not = ["pypi_production_stable", "hedron_1_0"]

[remediations]
issues = [
  99, 100, 108, 136, 137, 138, 139, 140, 141, 145, 146, 147, 148, 151, 152, 156,
  160, 174, 175, 177, 187, 205, 206, 208, 217, 218, 238, 242, 243, 245, 246, 249,
]

# Per-tag Supported contract rows (STABLE-042 evidence). No new tags beyond D-070 lock.

[budgets]
reference_app = "examples/reference-app"
bundle_kb_ceiling = 750
request_count_ceiling = 40
upgrade_ms_ceiling = 2500
interaction_ms_ceiling = 100
memory_mb_ceiling = 256
leak_listeners_ceiling = 0
long_task_ms_ceiling = 50
layout_shift_ceiling = 0.1

[tags.hedron-example]
package = "hedron-elements"
module = "hedron-example.mjs"
abi_version = 1
form_associated = false
ssr_fallback = "server_region_content"
events = ["hedron-example-change"]
ownership = ["controlled", "local"]
slots_parts_tokens = ["status", "expanded"]

[tags.hedron-field-text]
package = "hedron-elements"
module = "hedron-field-text.mjs"
abi_version = 1
form_associated = true
ssr_fallback = "native_input"
events = ["hedron-field-change"]
ownership = ["controlled", "draft"]
slots_parts_tokens = ["value", "name"]

[tags.hedron-field-choice]
package = "hedron-elements"
module = "hedron-field-choice.mjs"
abi_version = 1
form_associated = true
ssr_fallback = "native_select_or_radios"
events = ["hedron-field-change"]
ownership = ["controlled", "draft"]
slots_parts_tokens = ["value", "name", "options"]

[tags.hedron-field-file]
package = "hedron-elements"
module = "hedron-field-file.mjs"
abi_version = 1
form_associated = true
ssr_fallback = "native_file_input"
events = ["hedron-field-change"]
ownership = ["controlled", "draft"]
slots_parts_tokens = ["name", "accept"]

[tags.hedron-disclosure]
package = "hedron-elements"
module = "hedron-disclosure.mjs"
abi_version = 1
form_associated = false
ssr_fallback = "details_summary"
events = ["hedron-disclosure-change"]
ownership = ["local", "preference"]
slots_parts_tokens = ["open"]
gesture_overlay = "disclosure"

[tags.hedron-dialog]
package = "hedron-elements"
module = "hedron-dialog.mjs"
abi_version = 1
form_associated = false
ssr_fallback = "dialog_native_or_link"
events = ["hedron-dialog-change"]
ownership = ["local"]
slots_parts_tokens = ["open"]
gesture_overlay = "dialog"

[tags.hedron-action-async]
package = "hedron-elements"
module = "hedron-action-async.mjs"
abi_version = 1
form_associated = false
ssr_fallback = "form_or_button_post"
events = ["hedron-action-state"]
ownership = ["controlled"]
interaction_state = ["idle", "pending", "success", "error", "canceled"]
slots_parts_tokens = ["state"]

[tags.hedron-data-editor]
package = "hedron-data"
module = "assets/tabulator/editor.js"
abi_version = 1
form_associated = false
ssr_fallback = "hedron-data-editor-fallback"
events = ["hedron-data-editor-change"]
ownership = ["controlled", "draft"]
optimistic_mutation = ["bounded_dataeditor_collection_cell_edits"]
slots_parts_tokens = ["rows", "columns"]

