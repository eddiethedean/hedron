# Phase 0.49 settings, measured-adapter, and research-disposition lock
# (FP-ADAPTER-001 / FP-SETTINGS-001 / FP-RESEARCH-001).
# Stage 0 contract artifact (D-084). FailFast is research only.

schema_version = 1
phase = "0.49"
status = "Planned"
planning_baseline = "v0.48.0"
required_predecessor = "v0.48.0"
target = "v0.49.0"
decision = "D-084"
owning_rfc = "RFC-0076"
gates = ["ADAPTER-VALIDATION-049", "SETTINGS-049", "RESEARCH-049"]
requirement = "FP-ADAPTER-001"

stacks_on_adapter = "docs/acceptance/adapter-disposition-044.toml"
new_package = false
stage_0_adds_pydantic_settings = false
evaluate_hedron_settings = false
formbody_request_path_not_adapter_candidate = true
diagnostic_family = "HED-FP-*"
diagnostic_family_docs_only = true

[adapters]
gate = "ADAPTER-VALIDATION-049"
adopt_if_measured = ["cached-type-adapter", "validate-json"]
not_on_this_gate = ["fail-fast-batch"]
preserve = [
    "duplicate-key rejection",
    "size/depth/count bounds",
    "canonical encoding",
    "redaction",
]
default_parsers_remain = true
rollback = "restore current parsers"
candidates = [
    "WebSocket messages",
    "MCP envelopes",
    "job/cache records",
    "build manifests",
    "remote-adapter metadata",
    "bounded data batches",
]

[settings]
gate = "SETTINGS-049"
state = "Evaluate"
allowed_dispositions = ["adopt", "retain-custom-loader"]
candidates = ["fastapi-workbench", "hedron-workbench", "hedron-posit"]
not_candidates = ["hedron", "hedron-core", "hedron.config.HedronSettings"]
today = "argparse WorkbenchConfig and custom loaders; no pydantic-settings dependency"
stage_1_default_until_spike = "Evaluate; likely retain-custom-loader"

[research]
gate = "RESEARCH-049"
state = "Experimental"
supported = []
candidates = ["partial-validation", "missing-sentinel", "fail-fast"]
partial_validation = "provisional stream only; complete validation before persist/action/authz/canonical UI"
missing_sentinel = "Hedron-owned unset vs experimental Pydantic MISSING; MISSING never Supported"
fail_fast = "whole-batch-reject adversarial ingestion only; off for forms/configuration"
no_supported_leakage = true
