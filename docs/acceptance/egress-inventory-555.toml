schema_version = 1
issue = 555
reviewed = "2026-08-30"
policy = "Every first-party server fetch uses hedron_core.fetch_with_policy; non-fetch network boundaries are explicitly classified."

[[surface]]
id = "core.shared_http"
owner = "hedron-core"
paths = ["packages/hedron-core/src/hedron_core/egress.py", "packages/hedron-core/src/hedron_core/egress_http.py"]
classification = "server_fetch"
disposition = "migrated"
rationale = "The concrete transport pins TCP to an approved resolution and reports the observed peer; core owns redirects, retries, deadlines, content checks, decompression, and cumulative budgets."

[[surface]]
id = "maps.proxy_validator"
owner = "hedron-maps"
paths = ["packages/hedron-maps/src/hedron_maps/proxy.py"]
classification = "validator_only"
disposition = "migrated"
rationale = "Map policy delegates to EgressPolicy. The package has no first-party fetch implementation; applications performing the fetch must use fetch_with_policy."

[[surface]]
id = "gradio.remote_adapter"
owner = "hedron-gradio"
paths = ["packages/hedron-gradio/src/hedron_gradio/client.py", "packages/hedron-gradio/src/hedron_gradio/policy.py"]
classification = "application_injection_boundary"
disposition = "migrated"
rationale = "Configuration preflight delegates to EgressPolicy. Automatic gradio_client networking fails closed because its connection cannot be pinned; the private callback seam is application-owned and creates no client in Hedron."

