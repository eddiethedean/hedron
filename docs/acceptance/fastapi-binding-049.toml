# Phase 0.49 native-model versus expanded-fields binding lock (FP-BIND-001).
# Stage 0 contract artifact (D-084). BindingPlan remains the 0.43 structural
# path/query plan. BoundaryBindingPlan is the new strategy record.

schema_version = 1
phase = "0.49"
status = "Verified"
planning_baseline = "v0.48.0"
required_predecessor = "v0.48.0"
target = "v0.49.0"
decision = "D-084"
owning_rfc = "RFC-0076"
gate = "BINDING-049"
requirement = "FP-BIND-001"

stacks_on_form = "docs/acceptance/type-form-inventory-044.toml"
stacks_on_schema = "docs/acceptance/type-schema-044.toml"
stacks_on_adapter = "docs/acceptance/adapter-disposition-044.toml"
stacks_on_host = "docs/acceptance/host-portable-facts-045.toml"
overload_binding_plan = false
numeric_limits = "MAX_MODEL_FIELDS=256; MAX_SCHEMA_DEPTH=16; MAX_UNION_VARIANTS=32; MAX_VALIDATION_ERRORS=100"
diagnostic_family = "HED-FP-*"
diagnostic_family_docs_only = false

[plans]
structural = "BindingPlan (path_params, query_params, required)"
strategy = "BoundaryBindingPlan"
strategies = ["native-model", "expanded-fields"]
strategy_fields = [
    "source",
    "model identity/fingerprint",
    "strategy",
    "field locations",
    "aliases",
    "extra-field policy",
    "content type",
    "adapter disposition",
    "fallback reason",
]

[native_model_eligible]
query_only = true
header_only = true
cookie_only = true
non_file_form = true
requires_fastapi_equivalence = true

[expanded_fields_required]
mixed_path_query = true
multipart_file = true
incompatible_aliases = true
portable_adapters = true
implementation = "hedron.type_authoring.signature.apply_modeled_signature plus PydanticBindingAdapter"

[compat]
existing_viewparams_formbody = "keep expanded-fields unless compiler proves equivalence"
author_override = "force portable expanded-fields fallback"
flask_django_native_model = false
non_opted_in_routes = "unchanged"

[consumed]
binding_plan = "hedron_core.updates.BindingPlan"
binding_adapter = "hedron_core.updates.BindingAdapter / StructuralBindingAdapter"
pydantic_adapter = "hedron.type_authoring.adapter.PydanticBindingAdapter"
signature = "hedron.type_authoring.signature.apply_modeled_signature / reconstruct_kwargs"
markers = ["ViewParams", "FormBody"]
reject_json_formbody = "415 HED-TYPE-0003; strict JSON lock extends this pattern"
