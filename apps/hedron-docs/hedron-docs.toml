schema_version = 4

[site]
title = "Hedron Docs"
description = "Deployable hedron-docs 0.5 proving application"
docs_dir = "docs"
allow_external_links = true
release_label = "Development build"

[build]
output = "build/site.json"
max_source_bytes = 2000000
max_asset_bytes = 10000000
max_nodes = 10000
max_depth = 64
max_table_cells = 10000
max_code_blocks = 200
max_code_block_bytes = 256000
max_directives = 100
max_query_length = 200
