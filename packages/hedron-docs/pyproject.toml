[project]
name = "hedron-docs"
version = "0.5.0"
description = "Experimental Markdown compiler and Hedron documentation application toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Odos Matthews", email = "odosmatthews@gmail.com" }]
keywords = ["documentation", "hedron", "markdown", "mkdocs", "static-site"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "hedron>=1.0.5,<2.0",
    "markdown-it-py>=3,<5",
    "mdit-py-plugins>=0.4,<1",
    "pyyaml>=6.0,<7",
    "tomli>=2.0.1; python_version < '3.11'",
    "uvicorn>=0.32,<1.0",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-docs/CHANGELOG.md"

[project.scripts]
hedron-docs = "hedron_docs.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_docs"]
include = ["src/hedron_docs/static/*.css"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
