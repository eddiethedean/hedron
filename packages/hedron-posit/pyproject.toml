[project]
name = "hedron-posit"
version = "0.47.0"
description = "Unified Posit Workbench / Connect deployment adapter for Hedron"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "fastapi",
    "hedron",
    "posit",
    "connect",
    "rstudio",
    "workbench",
    "asgi",
    "proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi-workbench>=1.0.0,<2.0",
    "hedron>=0.47.0,<0.48",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
hedron-posit = "hedron_posit.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-posit/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/guides/posit/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_posit"]

[tool.hatch.build.targets.wheel.force-include]
"src/pkg_resources" = "pkg_resources"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_posit",
    "src/pkg_resources",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
