[project]
name = "hedron-posit"
version = "1.0.2"
description = "Unified Posit Workbench / Connect deployment adapter for Hedron"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "fastapi",
    "hedron",
    "posit",
    "connect",
    "rstudio",
    "workbench",
    "asgi",
    "proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron>=1.0.0,<2.0",
    "fastapi-workbench>=1.0.2,<2.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.32",
    # Connect 2025.06 imports pkg_resources before user code. Keep the
    # compatibility provider in the environment instead of shipping a
    # top-level package that shadows and can overwrite setuptools.
    "setuptools<82",
]

[project.scripts]
hedron-posit = "hedron_posit.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-posit/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/guides/posit/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_posit"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_posit",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
