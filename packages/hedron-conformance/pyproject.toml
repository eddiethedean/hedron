[project]
name = "hedron-conformance"
version = "0.43.0"
description = "Language-neutral Hedron conformance-test kit and capability runner"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "conformance",
    "fixtures",
    "hedron",
    "portable",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4,<2.15",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Documentation = "https://hedron.readthedocs.io/en/latest/"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-conformance/CHANGELOG.md"

[project.scripts]
hedron-conformance = "hedron_conformance.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_conformance"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_conformance",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
