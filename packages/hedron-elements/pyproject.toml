[project]
name = "hedron-elements"
version = "1.0.4"
description = "Beta Web Component ABI, shared bridge, and Supported first-party elements for Hedron (RFC-0060)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "hedron",
    "web-components",
    "htmx",
    "custom-elements",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron-core>=1.0.0,<2.0",
]

[project.entry-points."hedron.plugins"]
hedron_elements = "hedron_elements.plugin:register"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-elements/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_elements"]

[tool.hatch.build.targets.wheel.force-include]
"src/hedron_elements/static/hedron-bridge.mjs" = "hedron_elements/static/hedron-bridge.mjs"
"src/hedron_elements/static/interaction-state.mjs" = "hedron_elements/static/interaction-state.mjs"
"src/hedron_elements/static/gesture-catalog.mjs" = "hedron_elements/static/gesture-catalog.mjs"
"src/hedron_elements/static/hedron-example.mjs" = "hedron_elements/static/hedron-example.mjs"
"src/hedron_elements/static/hedron-example.css" = "hedron_elements/static/hedron-example.css"
"src/hedron_elements/static/hedron-field-text.mjs" = "hedron_elements/static/hedron-field-text.mjs"
"src/hedron_elements/static/hedron-field-choice.mjs" = "hedron_elements/static/hedron-field-choice.mjs"
"src/hedron_elements/static/hedron-field-file.mjs" = "hedron_elements/static/hedron-field-file.mjs"
"src/hedron_elements/static/hedron-disclosure.mjs" = "hedron_elements/static/hedron-disclosure.mjs"
"src/hedron_elements/static/hedron-dialog.mjs" = "hedron_elements/static/hedron-dialog.mjs"
"src/hedron_elements/static/hedron-action-async.mjs" = "hedron_elements/static/hedron-action-async.mjs"
"src/hedron_elements/static/composition-041.mjs" = "hedron_elements/static/composition-041.mjs"
"src/hedron_elements/static/navigation-062.mjs" = "hedron_elements/static/navigation-062.mjs"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_elements",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
