[project]
name = "hedron"
version = "0.9.0"
description = "FastAPI-native typed component framework for HTML and HTMX"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "components",
    "fastapi",
    "html",
    "htmx",
    "server-rendered",
    "typed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron-core==0.9.0",
    "pydantic>=2.13.4,<2.14",
    "fastapi>=0.141.1,<0.142",
    "itsdangerous>=2.2",
    "packaging>=24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "hedron-explorer==0.9.0",
]
data = [
    "hedron-data==0.9.0",
]
charts = [
    "hedron-charts==0.9.0",
]
markdown = [
    "markdown>=3.5",
    "nh3>=0.2",
]
code = [
    "pygments>=2.17",
]
images = [
    "pillow>=10.0",
]
email = [
    "email-validator>=2.0",
]
sanitize = [
    "nh3>=0.2",
]
auth = [
    "authlib>=1.3",
    "httpx>=0.28",
]
browser = [
    "playwright>=1.40",
]
jinja = [
    "hedron-jinja==0.9.0",
]

[project.scripts]
hedron = "hedron.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
