[project]
name = "hedron"
version = "1.0.10"
description = "FastAPI-native component framework for HTML and HTMX"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "components",
    "fastapi",
    "html",
    "htmx",
    "server-rendered",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron-core>=1.0.0,<2.0",
    "pydantic>=2.12.0,<2.15",
    "fastapi>=0.121.0,<0.150",
    "starlette>=0.40.0,<2.0",
    "itsdangerous>=2.1.2",
    "packaging>=22.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "hedron-explorer>=1.0.0,<2.0",
]
data = [
    "hedron-data>=1.0.0,<2.0",
]
charts = [
    "hedron-charts>=1.0.0,<2.0",
]
maps = [
    "hedron-maps>=1.0.0,<2.0",
]
markdown = [
    "markdown>=3.4.1",
    "nh3>=0.2",
]
code = [
    "pygments>=2.17",
]
images = [
    "pillow>=10.0",
]
email = [
    "email-validator>=2.0",
]
sanitize = [
    "nh3>=0.2",
]
auth = [
    "authlib>=1.3",
    "httpx>=0.27",
]
browser = [
    "playwright>=1.40",
    "axe-playwright-python>=0.1.4",
]
jinja = [
    "hedron-jinja>=1.0.0,<2.0",
]
native = [
    "hedron-native>=0.1.3,<0.2",
]
conformance = [
    "hedron-conformance>=1.0.0,<2.0",
]
extras = [
    "hedron-extras>=1.0.0,<2.0",
]
experimental-ui = [
    "hedron-extras[experimental-ui]>=1.0.0,<2.0",
]
notebook = [
    "hedron-notebook>=0.2.3,<0.3",
]
mcp = [
    "hedron-mcp>=0.2.5,<0.3",
]
elements = ["hedron-elements>=1.0.0,<2.0"]
gradio = [
    "hedron-gradio>=0.2.3,<0.3",
]
posit = [
    "hedron-posit>=1.0.2,<2.0",
]
otel = [
    "opentelemetry-api>=1.27,<2",
]

[project.scripts]
hedron = "hedron.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
