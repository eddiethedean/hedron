[project]
name = "hedron"
version = "0.4.0"
description = "FastAPI-native typed component framework for HTML and HTMX"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "components",
    "fastapi",
    "html",
    "htmx",
    "server-rendered",
    "typed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron-core==0.4.0",
    "fastapi>=0.141.1,<0.142",
    "itsdangerous>=2.2",
    "packaging>=24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "hedron-explorer==0.4.0",
]
browser = [
    "playwright>=1.40",
]

[project.scripts]
hedron = "hedron.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron/CHANGELOG.md"
Documentation = "https://hedron-py.readthedocs.io/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
