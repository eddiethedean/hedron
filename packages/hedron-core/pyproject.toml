[project]
name = "hedron-core"
version = "0.1.0"
description = "Framework-neutral typed rendering core for Hedron"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pydantic>=2.13.4,<2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_core"]

[tool.hatch.build.targets.sdist]
include = ["src/hedron_core", "README.md"]
