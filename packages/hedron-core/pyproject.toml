[project]
name = "hedron-core"
version = "0.25.0"
description = "Framework-neutral typed rendering core for Hedron"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "components",
    "html",
    "htmx",
    "pydantic",
    "rendering",
    "server-rendered",
    "typed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4,<2.15",
    "packaging>=24.0",
]

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-core/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_core"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_core",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
