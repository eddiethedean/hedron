[project]
name = "hedron-extras"
version = "1.0.10"
description = "Curated optional extras and analysis workbenches for Hedron"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "components",
    "extras",
    "hedron",
    "workbench",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron-core>=1.0.0,<2.0",
]

[project.optional-dependencies]
# Several empty extras are deprecated stubs (install nothing / quarantine markers).
# Prefer hedron[extras] / hedron[experimental-ui] and named satellite extras; do not
# add new empty keys. Tracked for 1.0 extras-matrix freeze.
code_editor = []  # deprecated empty stub (CodeEditor remains host textarea)
json_editor = []
data_explorer = ["hedron-data>=1.0.0,<2.0"]
chart_workbench = ["hedron-data>=1.0.0,<2.0", "hedron-charts>=1.0.0,<2.0"]
image_tools = []
calendar = []
signature = []
typeahead = []
sandbox = []
terminal = []
joystick = []
experimental-ui = []
all = [
    "hedron-data>=1.0.0,<2.0",
    "hedron-charts>=1.0.0,<2.0",
]

[project.entry-points."hedron.plugins"]
hedron_extras = "hedron_extras.plugin:register"
hedron_extras_experimental = "hedron_extras.experimental:register"
hedron_extras_sandbox = "hedron_extras.sandbox_plugin:register"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-extras/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_extras"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_extras",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
