[project]
name = "hedron-gradio"
version = "0.1.0"
description = "Experimental Alpha Gradio client interop for Hedron (RFC-0049)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "gradio",
    "hedron",
    "inference",
    "interop",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron-core>=0.32.0,<0.33",
]

[project.entry-points."hedron.plugins"]
hedron_gradio = "hedron_gradio.plugin:register"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-gradio/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_gradio"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_gradio",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
