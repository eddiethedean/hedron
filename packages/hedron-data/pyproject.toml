[project]
name = "hedron-data"
version = "0.56.1"
description = "DataTable, DataEditor, and data-source toolkit for Hedron"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "components",
    "data",
    "datatable",
    "dataeditor",
    "hedron",
    "tabulator",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron-core>=0.56.0,<0.57",
]

[project.optional-dependencies]
# Empty extras are deprecated stubs (install nothing). Prefer documented Supported
# extras; do not add new empty keys. Tracked for 1.0 extras-matrix freeze.
pandas = ["pandas>=2.0", "narwhals>=1.0"]
polars = ["polars>=1.0", "narwhals>=1.0"]
pyarrow = ["pyarrow>=15.0", "narwhals>=1.0"]
dataframes = ["pandas>=2.0", "polars>=1.0", "pyarrow>=15.0", "narwhals>=1.0"]
sqlalchemy = ["sqlalchemy>=2.0,<3"]
sqlmodel = ["sqlalchemy>=2.0,<3", "sqlmodel>=0.0.22"]
aggrid = []  # deprecated empty stub
dask = ["dask[dataframe]>=2024.1"]
snowflake = ["snowflake-connector-python>=3.0"]
spreadsheet = []  # deprecated empty stub

[project.entry-points."hedron.plugins"]
hedron_data = "hedron_data.plugin:register"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-data/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_data"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_data",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
