[package]
name = "hedron-native"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Optional Rust acceleration for Hedron HTML escaping"
repository = "https://github.com/eddiethedean/hedron"
homepage = "https://github.com/eddiethedean/hedron"
documentation = "https://docs.rs/hedron-native"
readme = "README.md"
keywords = ["hedron", "html", "escape", "pyo3"]
categories = ["web-programming", "encoding"]
exclude = ["fuzz/target", "target", "wheelhouse", "dist"]

[lib]
name = "_native"
# rlib keeps `cargo publish` / `cargo test` verifiable; cdylib is for the Python wheel.
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
# Enabled by maturin for wheels; omit for crates.io verify / host `cargo test`.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.27" }
