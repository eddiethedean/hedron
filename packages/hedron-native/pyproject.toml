[project]
name = "hedron-native"
version = "0.1.2"
description = "Optional Rust acceleration for Hedron HTML escaping (Beta)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = ["hedron", "native", "rust", "acceleration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Documentation = "https://hedron.readthedocs.io/en/latest/"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-native/CHANGELOG.md"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "hedron_native._native"
features = ["extension-module"]

# Keep release artifacts reproducible. Maturin's generated Rust SBOM embeds
# the isolated build directory (which is intentionally random per build), so
# package SBOM generation is disabled here; dependency provenance remains
# captured by the repository's lockfile and release evidence.
[tool.maturin.sbom]
rust = false

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "pp* *-musllinux_*"
before-build = "rustup default stable"

# Native-wheels.yml already splits Linux across ubuntu-latest (x86_64) and
# ubuntu-24.04-arm (aarch64). Building both arches on one runner pulls a
# foreign manylinux image through QEMU, hits `exec format error`, and hangs
# until the job timeout.
[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
