[project]
name = "fastapi-workbench"
version = "1.0.1"
description = "Generic Posit Workbench / RStudio Server deployment adapter for FastAPI ASGI apps"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "fastapi",
    "posit",
    "rstudio",
    "workbench",
    "asgi",
    "proxy",
    "starlette",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "starlette>=0.40.0,<2.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.scripts]
fastapi-workbench = "fastapi_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/fastapi-workbench/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_workbench"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/fastapi_workbench",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
