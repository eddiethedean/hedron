[project]
name = "hedron-workbench"
version = "0.29.0"
description = "Posit Workbench / RStudio Server deployment adapter for Hedron"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
maintainers = [
    { name = "Odos Matthews", email = "odosmatthews@gmail.com" },
]
keywords = [
    "fastapi",
    "hedron",
    "posit",
    "rstudio",
    "workbench",
    "asgi",
    "proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "hedron>=0.29.0,<0.30",
    "starlette>=0.46",
    "uvicorn>=0.32",
]

[project.scripts]
hedron-workbench = "hedron_workbench.cli:main"

[project.urls]
Homepage = "https://github.com/eddiethedean/hedron"
Repository = "https://github.com/eddiethedean/hedron"
Issues = "https://github.com/eddiethedean/hedron/issues"
Changelog = "https://github.com/eddiethedean/hedron/blob/main/packages/hedron-workbench/CHANGELOG.md"
Documentation = "https://hedron.readthedocs.io/en/latest/guides/posit-workbench/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedron_workbench"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/hedron_workbench",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]
