name: HTMX stable version check

on:
  schedule:
    # Nightly at 05:17 UTC. The non-round minute reduces scheduled-run congestion.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: htmx-stable-version-check
  cancel-in-progress: true

jobs:
  check:
    name: Compare vendored HTMX pins with npm stable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check HTMX core and extension versions
        run: python scripts/check_htmx_versions.py
