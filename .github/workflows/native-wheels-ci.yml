name: Native wheel matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/native-wheels-ci.yml
      - .github/workflows/native-wheels.yml
      - packages/hedron-native/**
      - scripts/verify_native_wheel_inventory.py
  pull_request:
    paths:
      - .github/workflows/native-wheels-ci.yml
      - .github/workflows/native-wheels.yml
      - packages/hedron-native/**
      - scripts/verify_native_wheel_inventory.py

permissions:
  contents: read

concurrency:
  group: native-wheel-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  SOURCE_DATE_EPOCH: "315619200"
  CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
  CIBW_SKIP: "pp* *-musllinux_*"
  CIBW_ARCHS: native
  CIBW_BEFORE_ALL_LINUX: >-
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
    | sh -s -- -y --default-toolchain stable --profile default
  CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=stable SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" PYTHONDONTWRITEBYTECODE=1'
  CIBW_BEFORE_BUILD_MACOS: "rustup default stable"
  CIBW_BEFORE_BUILD_WINDOWS: "rustup default stable"
  CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" PYTHONDONTWRITEBYTECODE=1'

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel_platform: linux-x86_64
          - os: ubuntu-24.04-arm
            wheel_platform: linux-aarch64
          - os: macos-14
            wheel_platform: macos-arm64
          - os: windows-latest
            wheel_platform: windows-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install native build tools
        run: python -m pip install "cibuildwheel>=3.1,<4" "maturin>=1.7,<2"

      - name: Build and test native wheels
        working-directory: packages/hedron-native
        shell: bash
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Verify exact interpreter and platform matrix
        run: >-
          python scripts/verify_native_wheel_inventory.py
          packages/hedron-native/wheelhouse
          --platform "${{ matrix.wheel_platform }}"
          --output packages/hedron-native/wheelhouse/native-inventory-${{ matrix.wheel_platform }}.json

      - name: Retain platform wheels and inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hedron-native-wheel-${{ matrix.wheel_platform }}-${{ github.run_id }}
          path: packages/hedron-native/wheelhouse/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  evidence:
    name: Aggregate native release evidence
    needs: [wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install wheel filename parser
        run: python -m pip install "packaging>=24,<27"

      - name: Download all platform wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hedron-native-wheel-*-${{ github.run_id }}
          path: dist/native
          merge-multiple: true

      - name: Verify and record full native matrix
        run: >-
          python scripts/verify_native_wheel_inventory.py
          dist/native
          --all-platforms
          --output dist/native-artifacts.json

      - name: Retain combined wheels and release ledger
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hedron-native-evidence-${{ github.run_id }}
          path: |
            dist/native-artifacts.json
            dist/native/*.whl
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
