name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Format check
        run: uv run ruff format --check packages tests examples
      - name: Lint
        run: uv run ruff check packages tests examples
      - name: Type check
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q
      - name: Build all workspace packages
        run: |
          set -euo pipefail
          for pyproject in packages/*/pyproject.toml; do
            pkg="$(basename "$(dirname "$pyproject")")"
            echo "Building $pkg"
            uv build --package "$pkg"
          done
      - name: Clean-install smoke
        run: |
          set -euo pipefail
          uv venv /tmp/hedron-smoke --python ${{ matrix.python-version }}
          shopt -s nullglob
          wheels=(dist/hedron_core-*.whl)
          if ((${#wheels[@]})); then
            uv pip install --python /tmp/hedron-smoke "${wheels[@]}"
            /tmp/hedron-smoke/bin/python - <<'PY'
          from hedron_core import Page, Text, RenderMode, render
          html = render(Page(Text("smoke"), title="Smoke"), mode=RenderMode.PAGE).html
          assert html.startswith("<!DOCTYPE html>")
          assert "smoke" in html
          print("ok: clean-install render")
          PY
          fi
      - name: Prove no web frameworks or Node tooling in core env
        run: |
          uv run python -c "import importlib.util as u; assert u.find_spec('fastapi') is None; assert u.find_spec('flask') is None; assert u.find_spec('django') is None; print('ok: no FastAPI/Flask/Django')"
          test ! -f package.json
          test ! -d node_modules
          echo "ok: no Node package tooling in repo"
      - name: Doc link smoke
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("docs"), Path("README.md"), Path("ROADMAP.md")]
          missing = []
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              else:
                  files.extend(root.rglob("*.md"))
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in re.finditer(r"\]\(([^)#]+)(?:#[^)]*)?\)", text):
                  target = m.group(1)
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f"{path}: {target}")
          if missing:
              raise SystemExit("\n".join(missing[:50]))
          print("ok: relative doc links resolve")
          PY

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --python 3.12
      - name: Verify tag, versions, license, and changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)
              echo "Refusing to publish from non-version tag: $TAG" >&2
              exit 1
              ;;
          esac
          uv run python scripts/check_release_gate.py "$VERSION"
      - name: Build all workspace packages
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for pyproject in packages/*/pyproject.toml; do
            pkg="$(basename "$(dirname "$pyproject")")"
            echo "Building $pkg"
            uv build --package "$pkg"
          done
          ls -la dist
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_API_TOKEN secret is not set" >&2
            exit 1
          fi
          uv publish --token "$UV_PUBLISH_TOKEN"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(uv run python scripts/release_notes.py "$VERSION")"
          gh release create "$TAG" dist/hedron_core-* \
            --title "hedron-core ${VERSION}" \
            --notes "$NOTES"
