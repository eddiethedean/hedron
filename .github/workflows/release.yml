name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.12.1"

jobs:
  test:
    name: Test and checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Format check
        run: uv run --python ${{ matrix.python-version }} ruff format --check packages tests examples
      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check packages tests examples
      - name: Type check
        run: uv run --python ${{ matrix.python-version }} pyright
      - name: Tests
        run: uv run --python ${{ matrix.python-version }} pytest -q
      - name: Build all workspace packages
        run: |
          set -euo pipefail
          for pyproject in packages/*/pyproject.toml; do
            pkg="$(basename "$(dirname "$pyproject")")"
            echo "Building $pkg"
            uv build --package "$pkg"
          done
      - name: Clean-install smoke
        run: |
          set -euo pipefail
          uv venv /tmp/hedron-smoke --python ${{ matrix.python-version }}
          shopt -s nullglob
          core_wheels=(dist/hedron_core-*.whl)
          hedron_wheels=(dist/hedron-[0-9]*.whl)
          if ((${#core_wheels[@]})); then
            uv pip install --python /tmp/hedron-smoke "${core_wheels[@]}"
            /tmp/hedron-smoke/bin/python - <<'PY'
          from hedron_core import Page, Text, RenderMode, render
          html = render(Page(Text("smoke"), title="Smoke"), mode=RenderMode.PAGE).html
          assert html.startswith("<!DOCTYPE html>")
          assert "smoke" in html
          print("ok: clean-install hedron-core render")
          PY
          fi
          if ((${#hedron_wheels[@]})); then
            uv pip install --python /tmp/hedron-smoke "${hedron_wheels[@]}"
            data_wheels=(dist/hedron_data-*.whl)
            if ((${#data_wheels[@]})); then
              uv pip install --python /tmp/hedron-smoke "${data_wheels[@]}"
            fi
            /tmp/hedron-smoke/bin/python - <<'PY'
          from hedron import Hedron, Page, Text
          from hedron_core import render
          app = Hedron(title="smoke", security="standard", explorer="off", session_secret="smoke-secret")
          @app.page("/")
          def home():
              return Page(Text("ok"), title="Ok")
          try:
              from hedron_data import DataTable
              assert "Ada" in render(DataTable([{"id": "1", "name": "Ada"}])).html
          except ImportError:
              pass
          print("ok: clean-install Hedron")
          PY
          fi
      - name: Prove no web frameworks or Node tooling in core env
        run: |
          uv run --python ${{ matrix.python-version }} python - <<'PY'
          import ast, tomllib
          from pathlib import Path
          forbidden = {"fastapi", "flask", "django", "starlette", "asgiref"}
          project = tomllib.loads(Path("packages/hedron-core/pyproject.toml").read_text())["project"]
          deps = " ".join(project.get("dependencies", [])).lower()
          assert not any(name in deps for name in forbidden)
          for path in Path("packages/hedron-core/src/hedron_core").rglob("*.py"):
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          assert alias.name.split(".", 1)[0] not in forbidden
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      assert node.module.split(".", 1)[0] not in forbidden
          print("ok: hedron-core remains framework-neutral")
          PY
          test ! -f package.json
          test ! -d node_modules
          echo "ok: no Node package tooling in repo"
      - name: Doc link smoke
        run: |
          uv run --python ${{ matrix.python-version }} python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("docs"), Path("README.md"), Path("ROADMAP.md")]
          missing = []
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              else:
                  files.extend(root.rglob("*.md"))
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in re.finditer(r"\]\(([^)#]+)(?:#[^)]*)?\)", text):
                  target = m.group(1)
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f"{path}: {target}")
          if missing:
              raise SystemExit("\n".join(missing[:50]))
          print("ok: relative doc links resolve")
          PY
      - name: MkDocs build
        if: matrix.python-version == '3.12'
        run: |
          uv sync --locked --group docs --python ${{ matrix.python-version }}
          uv run --python ${{ matrix.python-version }} --group docs mkdocs build --strict

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync
        run: uv sync --locked --python 3.11
      - name: Verify tag, versions, license, and changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)
              echo "Refusing to publish from non-version tag: $TAG" >&2
              exit 1
              ;;
          esac
          uv run --python 3.11 python scripts/check_release_gate.py "$VERSION"
      - name: Build all workspace packages
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for pyproject in packages/*/pyproject.toml; do
            pkg="$(basename "$(dirname "$pyproject")")"
            echo "Building $pkg"
            uv build --package "$pkg"
          done
          ls -la dist
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_API_TOKEN secret is not set" >&2
            exit 1
          fi
          uv publish --token "$UV_PUBLISH_TOKEN"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(uv run --python 3.11 python scripts/release_notes.py "$VERSION" --package hedron)"
          gh release create "$TAG" dist/* \
            --title "Hedron ${VERSION}" \
            --notes "$NOTES"
