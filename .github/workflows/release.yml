name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.12.1"
  # Shared check suites live in scripts/ci_checks.sh (also used by ci.yml).
  HEDRON_GATE_VERSION: "0.20.0"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run test suite
        run: bash scripts/ci_checks.sh test --python ${{ matrix.python-version }}

  quality:
    name: Quality, docs, and packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install all dependency groups
        run: uv sync --locked --all-groups --python 3.12
      - name: Run quality suite
        run: bash scripts/ci_checks.sh quality --python 3.12

  browser:
    name: Browser HTMX (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies with browser extra
        run: |
          uv sync --locked --python 3.12 --group docs
          uv pip install --python 3.12 "playwright>=1.40" "uvicorn[standard]>=0.30" "axe-playwright-python>=0.1.4"
          uv run --python 3.12 playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser suite
        env:
          HEDRON_BROWSER: "1"
          HEDRON_BROWSER_ENGINE: ${{ matrix.browser }}
        run: bash scripts/ci_checks.sh browser --python 3.12

  evidence:
    name: Supply-chain evidence bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve gate version
        id: gate
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${HEDRON_GATE_VERSION}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run evidence suite
        run: >
          bash scripts/ci_checks.sh evidence --python 3.12
          --gate-version ${{ steps.gate.outputs.version }}

  publish:
    name: Publish to PyPI
    needs: [test, quality, browser, evidence]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # PyPI caps new-project creates (~4/day). Retries wait up to ~6h on 429.
    timeout-minutes: 420
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Sync
        run: uv sync --locked --python 3.11
      - name: Verify tag, versions, license, and changelog
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) VERSION="${TAG#v}" ;;
            *)
              echo "Refusing to publish from non-version tag: $TAG" >&2
              exit 1
              ;;
          esac
          uv run --python 3.11 python scripts/check_release_gate.py "$VERSION"
      - name: Build evidence bundle
        run: |
          uv run --python 3.11 python scripts/build_evidence_bundle.py
          uv run --python 3.11 --with pip-audit python scripts/dep_audit.py
      - name: Build all workspace packages
        run: |
          set -euo pipefail
          rm -rf dist/*.whl dist/*.tar.gz
          mkdir -p dist
          for pyproject in packages/*/pyproject.toml; do
            pkg="$(basename "$(dirname "$pyproject")")"
            echo "Building $pkg"
            uv build --package "$pkg"
          done
          ls -la dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/evidence-bundle/*
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_API_TOKEN secret is not set" >&2
            exit 1
          fi

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          # Skip versions already on PyPI (idempotent retags). Classify the
          # rest: existing projects first, then new creates. PyPI limits new
          # project creation (~4/day); space creates and retry 429s.
          existing_names=()
          new_names=()
          for pyproject in packages/*/pyproject.toml; do
            name="$(uv run --python 3.11 python - <<PY
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("${pyproject}").read_text())["project"]["name"])
          PY
          )"
            # PEP 503 normalized name for JSON/simple indexes.
            normalized="$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]' | tr '_.' '-')"
            version_code="$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://pypi.org/pypi/${normalized}/${VERSION}/json")"
            if [ "$version_code" = "200" ]; then
              echo "Skipping ${name}==${VERSION} (already on PyPI)"
              continue
            elif [ "$version_code" != "404" ]; then
              echo "Unexpected PyPI version status ${version_code} for ${name}==${VERSION}" >&2
              exit 1
            fi
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.pypi.simple.v1+json' \
              "https://pypi.org/simple/${normalized}/")"
            if [ "$code" = "200" ]; then
              existing_names+=("$name")
            elif [ "$code" = "404" ]; then
              new_names+=("$name")
            else
              echo "Unexpected PyPI status ${code} for ${name}" >&2
              exit 1
            fi
          done

          echo "Existing PyPI projects to publish: ${existing_names[*]:-none}"
          echo "New PyPI projects to publish: ${new_names[*]:-none}"

          publish_one() {
            local name="$1"
            local kind="$2"
            # Match hatchling artifacts: hyphens become underscores in filenames.
            local stem="${name//-/_}"
            local -a files
            shopt -s nullglob
            files=(dist/"${stem}"-*.whl dist/"${stem}"-*.tar.gz)
            if ((${#files[@]} == 0)); then
              echo "No dist artifacts for ${name} (stem=${stem})" >&2
              return 1
            fi
            local attempt=1
            local max_attempts=7
            local out=""
            while true; do
              echo "Publishing ${kind} project ${name} (attempt ${attempt}/${max_attempts}): ${files[*]}"
              set +e
              out="$(uv publish --token "$UV_PUBLISH_TOKEN" "${files[@]}" 2>&1)"
              local status=$?
              set -e
              printf '%s\n' "$out"
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if [ "$kind" = "NEW" ] && [ "$attempt" -lt "$max_attempts" ] \
                && printf '%s' "$out" | grep -Eqi '429|Too many new projects'; then
                echo "PyPI new-project rate limit; waiting 60 minutes before retry"
                sleep 3600
                attempt=$((attempt + 1))
                continue
              fi
              return "$status"
            done
          }

          failed_names=()

          for name in "${existing_names[@]}"; do
            if ! publish_one "$name" "existing"; then
              echo "WARN: publish failed for existing project ${name}; continuing with next package" >&2
              failed_names+=("$name")
            fi
          done

          published_new=0
          for name in "${new_names[@]}"; do
            if [ "$published_new" -eq 1 ]; then
              echo "Waiting 15 minutes before creating new PyPI project: ${name}"
              sleep 900
            fi
            if publish_one "$name" "NEW"; then
              published_new=1
            else
              echo "WARN: publish failed for NEW project ${name}; continuing with next package" >&2
              failed_names+=("$name")
              # Count the attempt so subsequent new creates still respect spacing.
              published_new=1
            fi
          done

          if ((${#failed_names[@]})); then
            echo "One or more packages failed to publish: ${failed_names[*]}" >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(uv run --python 3.11 python scripts/release_notes.py "$VERSION" --package hedron)"
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --title "Hedron ${VERSION}" \
            --notes "$NOTES"
          if [ -d dist/evidence-bundle ]; then
            gh release upload "$TAG" dist/evidence-bundle/* --clobber
          fi
