name: Release

on:
  push:
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Release tag to publish (e.g. release-20260902-01)."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.publish_tag || github.ref_name }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_NO_SYNC: "1"
  # Reproducible wheel/sdist metadata and native Mach-O IDs.
  SOURCE_DATE_EPOCH: "315619200"
  PYTHONDONTWRITEBYTECODE: "1"
  UV_VERSION: "0.12.1"

jobs:
  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/release-') || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve publish ref
        id: ref
        env:
          PUBLISH_TAG: ${{ inputs.publish_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$PUBLISH_TAG" ]; then
            TAG="$PUBLISH_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            release-*) ;;
            v*)
              if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
                echo "Refusing legacy version tag outside manual recovery: $TAG" >&2
                exit 1
              fi
              echo "Using legacy version tag for manual recovery: $TAG" >&2
              ;;
            *)
              echo "Refusing to publish from non-release tag: $TAG" >&2
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check_release_ci.sh
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync
        run: uv sync --locked --python 3.12 --no-install-package hedron-native
      - name: Resolve release version from checked-out metadata
        id: version
        run: |
          set -euo pipefail
          version="$(uv run --python 3.12 python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Verify tag, versions, license, and changelog
        run: |
          set -euo pipefail
          # Engineering publish for 0.21 allows Planned human-AT session gates.
          # 0.28+ capability gates are Verified — do not pass --allow-planned.
          version="${{ steps.version.outputs.version }}"
          if [[ "$version" == 0.21* ]]; then
            uv run --python 3.12 python scripts/check_release_gate.py \
              "$version" --allow-planned
          else
            uv run --python 3.12 python scripts/check_release_gate.py "$version"
          fi
      - name: Build evidence bundle
        run: |
          uv run --python 3.12 python scripts/build_evidence_bundle.py \
            --version "${{ steps.version.outputs.version }}"
          uv run --python 3.12 --with pip-audit python scripts/dep_audit.py
      - name: Build all workspace packages
        run: |
          set -euo pipefail
          rm -rf dist/*.whl dist/*.tar.gz
          mkdir -p dist
          for pyproject in packages/*/pyproject.toml; do
            pkg="$(basename "$(dirname "$pyproject")")"
            if [ "$pkg" = "hedron-native" ]; then
              echo "Skipping hedron-native; publish it only from native-wheels.yml"
              continue
            fi
            echo "Building $pkg"
            uv build --package "$pkg"
          done
          ls -la dist
      - name: Verify all package wheels and immutable PyPI parity
        run: >
          uv run --python 3.12 python scripts/check_workbench_release_artifacts.py
          --dist-dir dist
      - name: Verify built quick start before publication
        run: >
          uv run --python 3.12 python scripts/check_published_quickstart.py
          "${{ steps.version.outputs.version }}" --dist-dir dist --attempts 1
      - name: Verify exact approved candidate artifacts
        if: ${{ steps.version.outputs.version == '1.0.0' }}
        run: uv run --python 3.12 python scripts/verify_release_artifacts.py
      - name: Verify exact approved 1.2.0 candidate artifacts
        if: ${{ steps.version.outputs.version == '1.2.0' }}
        run: >
          uv run --python 3.12 python scripts/verify_release_artifacts.py
          --evidence-manifest docs/acceptance/evidence-120/python-artifacts.json
          --dist-dir dist --expected-artifact-count 44 --exact-set
      - name: Verify exact approved 1.3.0 candidate artifacts
        if: ${{ steps.version.outputs.version == '1.3.0' }}
        run: >
          uv run --python 3.12 python scripts/verify_release_artifacts.py
          --evidence-manifest docs/acceptance/evidence-130/python-artifacts.json
          --dist-dir dist --exact-set
      - name: Write release checksum manifest
        run: >
          uv run --python 3.12 python scripts/write_release_manifest.py
          "${{ steps.version.outputs.version }}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/evidence-bundle/*
            dist/release-manifest.json
      - name: Publish to PyPI
        id: pypi
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${UV_PUBLISH_TOKEN:?PYPI_API_TOKEN secret is not set}"
          # Fail before dependents if any package cannot be uploaded. Re-runs
          # skip identical files and complete partially uploaded packages.
          order="$(uv run --python 3.12 python scripts/release_publish_order.py)"
          while IFS= read -r name; do
            if [ "$name" = "hedron-native" ]; then
              continue
            fi
            stem="${name//-/_}"
            files=(dist/"${stem}"-*.whl dist/"${stem}"-*.tar.gz)
            for file in "${files[@]}"; do
              test -f "$file"
            done
            timeout 180 uv publish --check-url https://pypi.org/simple/ "${files[@]}"
          done <<< "$order"
      - name: Publish hedron-runtime-node to npm
        id: npm_runtime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/hedron-runtime-node
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not set; skipping npm publish" >&2
            exit 0
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          set +e
          out="$(npm publish --access public 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$out" | grep -Eqi 'cannot publish over|already exists|EPUBLISHCONFLICT'; then
            echo "INFO: npm already has this version; treating as success"
            exit 0
          fi
          exit "$status"
      - name: Publish hedron-runtime-java (optional)
        id: maven_runtime
        working-directory: packages/hedron-runtime-java
        run: |
          set -euo pipefail
          if [ -z "${SONATYPE_USERNAME:-}" ] || [ -z "${SONATYPE_PASSWORD:-}" ]; then
            echo "SONATYPE credentials unset; skipping Maven publication"
            exit 0
          fi
          if ! command -v mvn >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y maven
          fi
          mvn -q -DskipTests deploy
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      - name: Verify the published quick start
        id: verify_quickstart
        if: ${{ !cancelled() && steps.pypi.outcome == 'success' }}
        run: >
          uv run --python 3.12 python scripts/check_published_quickstart.py
          "${{ steps.version.outputs.version }}"
      - name: Create GitHub Release
        if: ${{ !cancelled() && steps.pypi.outcome == 'success' && steps.verify_quickstart.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$(uv run --python 3.12 python scripts/release_notes.py "$VERSION" --package hedron)"
          shopt -s nullglob
          # SUPPLY: omit plain linux_* wheels (PyPI rejects them); keep manylinux/musllinux.
          artifacts=()
          for f in dist/*.whl dist/*.tar.gz; do
            case "$f" in
              *-linux_*.whl|*-linux-*.whl)
                if [[ "$f" != *manylinux* && "$f" != *musllinux* ]]; then
                  echo "WARN: omitting unsupported platform wheel from GitHub Release: $f" >&2
                  continue
                fi
                ;;
            esac
            artifacts+=("$f")
          done

          # SUPPLY-025: require wheels + SBOM/evidence before any GitHub Release create/upload
          # so a failed evidence step never leaves an orphan tag release missing SBOM.
          if ((${#artifacts[@]} == 0)); then
            echo "SUPPLY-025: no dist wheels/sdists to attach (earlier steps may have failed)" >&2
            exit 1
          fi
          if [ ! -d dist/evidence-bundle ]; then
            echo "SUPPLY-025: missing dist/evidence-bundle (required on train tags)" >&2
            exit 1
          fi
          if [ ! -f dist/release-manifest.json ]; then
            echo "SUPPLY-025: missing dist/release-manifest.json" >&2
            exit 1
          fi
          mapfile -t evidence_artifacts < <(find dist/evidence-bundle -type f | sort)
          if ((${#evidence_artifacts[@]} == 0)); then
            echo "SUPPLY-025: dist/evidence-bundle has no files to attach" >&2
            exit 1
          fi

          attach=("${artifacts[@]}" "${evidence_artifacts[@]}" dist/release-manifest.json)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading wheels + evidence"
            gh release upload "$TAG" "${attach[@]}" --clobber
          else
            gh release create "$TAG" "${attach[@]}" \
              --title "Hedron ${VERSION}" \
              --notes "$NOTES"
          fi
