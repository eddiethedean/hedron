name: CI

on:
  push:
    branches: [main, v1.0]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  UV_NO_SYNC: "1"
  UV_VERSION: "0.12.1"
  HEDRON_GATE_VERSION: "1.3.0"

jobs:
  changes:
    name: Classify changes and check package versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request — full CI."
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$BASE"..."$HEAD")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files — full CI."
            exit 0
          fi
          docs_only=true
          for f in "${files[@]}"; do
            case "$f" in
              docs/*|README.md|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md|mkdocs.yml|\
              scripts/sync_demo_code_tabs.py|scripts/generate_component_docs.py|\
              scripts/generate_sim_demos.py|scripts/check_docs_train_ssot.py|scripts/check_docs_adoption_contract.py|\
              scripts/generate_edron_api_index.py|scripts/generate_example_catalog.py|examples/catalog.toml|\
              scripts/check_package_docs_inventory.py|\
              scripts/check_documentation_ownership.py|scripts/check_api_docs_coverage.py|\
              scripts/check_package_readme_links.py|scripts/check_public_doc_links.py|\
              scripts/check_changelog_structure.py|scripts/check_external_links.py|\
              scripts/check_recipe_code_sync.py|scripts/check_docs_file_tabs.py|scripts/check_docs_examples.py|scripts/README.md|.github/workflows/docs-health.yml)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only} (${#files[@]} files)"

      - name: Verify changed packages have version bumps
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_changed_package_versions.py "$BASE_SHA" "$HEAD_SHA"

  coverage:
    name: Tests, branch coverage, and Chromium
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install dependencies
        run: uv sync --locked --group docs --python 3.12
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}-chromium
      - name: Install Chromium for package branch coverage
        run: bash scripts/ci_install_playwright.sh chromium 3.12
      - name: Run test suite with package branch coverage
        run: bash scripts/ci_checks.sh coverage --python 3.12
      - name: Upload Python package coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-coverage-3.12
          path: |
            coverage.xml
            coverage.json
            test-results/*.xml
          if-no-files-found: error

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run test suite
        run: bash scripts/ci_checks.sh test --python ${{ matrix.python-version }}

  quality:
    name: Lint, strict typing, and docs
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.11
      - name: Install check dependencies
        run: uv sync --locked --all-groups --python 3.11
      - name: Run quality suite with strict package typing gate
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/ci_checks.sh quality --python 3.11 --skip-wheels
      - name: Run docs suite
        if: needs.changes.outputs.docs_only == 'true'
        run: bash scripts/ci_checks.sh docs --python 3.11

  packaging:
    name: Package wheels and clean-install smoke
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Run packaging suite
        run: bash scripts/ci_checks.sh packaging --python 3.12

  dependency-bounds:
    name: Stable dependency bounds (${{ matrix.bounds }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bounds: [minimum, latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Run dependency bounds
        run: bash scripts/ci_checks.sh workbench --python 3.12 --bounds ${{ matrix.bounds }}

  browser:
    name: Browser HTMX (${{ matrix.browser }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Chromium runs once in the coverage job.
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --locked --group docs --python 3.12 --no-install-package hedron-native
      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-playwright-${{ hashFiles('uv.lock') }}-${{ matrix.browser }}
      - name: Install Playwright browser
        run: bash scripts/ci_install_playwright.sh ${{ matrix.browser }} 3.12
      - name: Run browser suite
        env:
          HEDRON_BROWSER: "1"
          HEDRON_BROWSER_ENGINE: ${{ matrix.browser }}
        run: bash scripts/ci_checks.sh browser --python 3.12
      - name: Retain browser and skip-classification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-htmx-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI required
    if: always()
    needs: [changes, coverage, test, dependency-bounds, quality, browser, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required CI outcomes
        env:
          RESULTS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          required = {"changes", "quality"}
          if os.environ["DOCS_ONLY"] != "true":
              required.update({"coverage", "packaging"})
              if os.environ["EVENT_NAME"] != "pull_request":
                  required.update({"test", "dependency-bounds", "browser"})
          failed = {name: results[name]["result"] for name in required
                    if results[name]["result"] != "success"}
          if failed:
              raise SystemExit(f"Required CI checks did not succeed: {failed}")
          PYTHON
