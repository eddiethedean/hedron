name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.12.1"
  # Shared check suites live in scripts/ci_checks.sh (also used by release.yml).
  HEDRON_GATE_VERSION: "0.28.2"

jobs:
  changes:
    name: Detect docs-only PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Not a pull_request — full CI."
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          mapfile -t files < <(git diff --name-only "$BASE"..."$HEAD")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files — full CI."
            exit 0
          fi
          docs_only=true
          for f in "${files[@]}"; do
            case "$f" in
              docs/*|README.md|CONTRIBUTING.md|SECURITY.md|CODE_OF_CONDUCT.md|mkdocs.yml|\
              scripts/sync_demo_code_tabs.py|scripts/generate_component_docs.py|\
              scripts/generate_sim_demos.py|scripts/check_docs_train_ssot.py|\
              scripts/check_documentation_ownership.py|scripts/check_api_docs_coverage.py|\
              scripts/check_package_readme_links.py|scripts/check_external_links.py|\
              scripts/check_recipe_code_sync.py|scripts/README.md|.github/workflows/docs-health.yml)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only} (${#files[@]} files)"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run test suite
        run: bash scripts/ci_checks.sh test --python ${{ matrix.python-version }}

  quality:
    name: Quality, docs, and packages
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install all dependency groups
        run: uv sync --locked --all-groups --python 3.12
      - name: Run quality suite
        run: bash scripts/ci_checks.sh quality --python 3.12

  browser:
    name: Browser HTMX (${{ matrix.browser }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PRs: Chromium only. Main/dispatch: Chromium + Firefox + WebKit.
    # Docs-only PRs skip the browser matrix (quality still runs mkdocs + train SSOT).
    if: >
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox", "webkit"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies with browser extra
        run: |
          uv sync --locked --python 3.12 --group docs
          uv pip install --python 3.12 "playwright>=1.40" "uvicorn[standard]>=0.30" "axe-playwright-python>=0.1.4"
          uv run --python 3.12 playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser suite
        env:
          HEDRON_BROWSER: "1"
          HEDRON_BROWSER_ENGINE: ${{ matrix.browser }}
        run: bash scripts/ci_checks.sh browser --python 3.12
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-htmx-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  evidence:
    name: Supply-chain evidence bundle
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run evidence suite
        run: bash scripts/ci_checks.sh evidence --python 3.12 --gate-version ${{ env.HEDRON_GATE_VERSION }}
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: hedron-evidence-bundle
          path: dist/evidence-bundle/
          if-no-files-found: error

  release:
    name: PKG-028 packaging rehearsal
    needs: [changes, evidence]
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run packaging suite
        run: bash scripts/ci_checks.sh packaging --python 3.12
