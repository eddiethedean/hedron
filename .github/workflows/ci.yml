name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --python ${{ matrix.python-version }}
      - name: Format check
        run: uv run ruff format --check packages tests examples
      - name: Lint
        run: uv run ruff check packages tests examples
      - name: Type check
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q
      - name: Build package
        run: uv build --package hedron-core
      - name: Clean-install smoke
        run: |
          uv venv /tmp/hedron-smoke --python ${{ matrix.python-version }}
          uv pip install --python /tmp/hedron-smoke dist/hedron_core-*.whl
          /tmp/hedron-smoke/bin/python - <<'PY'
          from hedron_core import Page, Text, RenderMode, render
          html = render(Page(Text("smoke"), title="Smoke"), mode=RenderMode.PAGE).html
          assert html.startswith("<!DOCTYPE html>")
          assert "smoke" in html
          print("ok: clean-install render")
          PY
      - name: Prove no web frameworks or Node tooling in core env
        run: |
          uv run python -c "import importlib.util as u; assert u.find_spec('fastapi') is None; assert u.find_spec('flask') is None; assert u.find_spec('django') is None; print('ok: no FastAPI/Flask/Django')"
          test ! -f package.json
          test ! -d node_modules
          # CI image may include node; core must not require it.
          echo "ok: no Node package tooling in repo"
      - name: Doc link smoke
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("docs"), Path("README.md"), Path("ROADMAP.md")]
          missing = []
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              else:
                  files.extend(root.rglob("*.md"))
          for path in files:
              text = path.read_text(encoding="utf-8")
              for m in re.finditer(r"\]\(([^)#]+)(?:#[^)]*)?\)", text):
                  target = m.group(1)
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f"{path}: {target}")
          if missing:
              raise SystemExit("\n".join(missing[:50]))
          print("ok: relative doc links resolve")
          PY
