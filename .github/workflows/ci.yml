name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.12.1"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest -q

  quality:
    name: Quality, docs, and packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install all dependency groups
        run: uv sync --locked --all-groups --python 3.12
      - name: Check formatting
        run: uv run --python 3.12 ruff format --check packages tests examples
      - name: Lint
        run: uv run --python 3.12 ruff check packages tests examples
      - name: Type check
        run: uv run --python 3.12 pyright
      - name: Build packages
        run: |
          set -euo pipefail
          for pyproject in packages/*/pyproject.toml; do
            package="$(basename "$(dirname "$pyproject")")"
            echo "Building $package"
            uv build --package "$package"
          done
      - name: Test clean wheel installation
        run: |
          set -euo pipefail
          uv venv /tmp/hedron-smoke --python 3.12
          uv pip install --python /tmp/hedron-smoke dist/*.whl
          /tmp/hedron-smoke/bin/python - <<'PY'
          from hedron_core import Page, RenderMode, Text, render

          html = render(Page(Text("smoke"), title="Smoke"), mode=RenderMode.PAGE).html
          assert html.startswith("<!DOCTYPE html>")
          assert "smoke" in html

          from hedron import Hedron
          from hedron_data import DataTable
          from hedron_explorer import explorer_router
          from hedron_sample_kit import __version__ as sample_kit_version

          table = DataTable([{"id": "1", "name": "Ada"}])
          assert "Ada" in render(table).html

          app = Hedron(
              title="smoke",
              security="standard",
              explorer="off",
              session_secret="smoke-secret",
          )

          @app.page("/")
          def home():
              return Page(Text("ok"), title="Ok")

          assert explorer_router is not None
          assert sample_kit_version
          print("ok: all workspace wheels install and import cleanly")
          PY
      - name: Prove hedron-core has no web-framework dependency
        run: |
          uv run --python 3.12 python - <<'PY'
          import ast
          import tomllib
          from pathlib import Path

          forbidden = {"fastapi", "flask", "django", "starlette", "asgiref"}
          project = tomllib.loads(Path("packages/hedron-core/pyproject.toml").read_text())["project"]
          deps = " ".join(project.get("dependencies", [])).lower()
          assert not any(name in deps for name in forbidden)
          for path in Path("packages/hedron-core/src/hedron_core").rglob("*.py"):
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          assert alias.name.split(".", 1)[0] not in forbidden
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      assert node.module.split(".", 1)[0] not in forbidden
          print("ok: hedron-core remains framework-neutral")
          PY
          test ! -f package.json
          test ! -d node_modules
          echo "ok: no Node package tooling in repo"
      - name: Check documentation links
        run: |
          uv run --python 3.12 python - <<'PY'
          import re
          from pathlib import Path

          roots = [Path("docs"), Path("README.md"), Path("ROADMAP.md")]
          missing = []
          files = []
          for root in roots:
              if root.is_file():
                  files.append(root)
              else:
                  files.extend(root.rglob("*.md"))
          for path in files:
              if path.is_symlink():
                  continue
              text = path.read_text(encoding="utf-8")
              for match in re.finditer(r"\]\(([^)#]+)(?:#[^)]*)?\)", text):
                  target = match.group(1)
                  if target.startswith(("http://", "https://", "mailto:")):
                      continue
                  resolved = (path.parent / target).resolve()
                  if not resolved.exists():
                      missing.append(f"{path}: {target}")
          if missing:
              raise SystemExit("\n".join(missing[:50]))
          print("ok: relative doc links resolve")
          PY
      - name: Build documentation
        run: uv run --python 3.12 --group docs mkdocs build --strict

  browser:
    name: Browser HTMX (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # PRs: Chromium only. Main/dispatch: Chromium + Firefox + WebKit.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox", "webkit"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies with browser extra
        run: |
          uv sync --locked --python 3.12
          uv pip install --python 3.12 "playwright>=1.40" "uvicorn[standard]>=0.30"
          uv run --python 3.12 playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser suite
        env:
          HEDRON_BROWSER: "1"
          HEDRON_BROWSER_ENGINE: ${{ matrix.browser }}
        run: uv run --python 3.12 pytest -q -m browser --tb=short
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-htmx-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  evidence:
    name: Supply-chain evidence bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Build evidence bundle
        run: |
          uv run --python 3.12 python scripts/build_evidence_bundle.py
          uv run --python 3.12 --with pip-audit python scripts/dep_audit.py
          uv run --python 3.12 python scripts/check_release_gate.py 0.9.0
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: hedron-evidence-bundle
          path: dist/evidence-bundle/
          if-no-files-found: error
