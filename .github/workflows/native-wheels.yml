name: Native wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "packages/hedron-native/**"
      - ".github/workflows/native-wheels.yml"
  pull_request:
    paths:
      - "packages/hedron-native/**"
      - ".github/workflows/native-wheels.yml"

permissions:
  contents: read

concurrency:
  group: native-wheels-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
  CIBW_SKIP: "pp* *-musllinux_*"
  CIBW_BEFORE_BUILD: "rustup default stable"
  CIBW_ENVIRONMENT: 'PATH="$HOME/.cargo/bin:$PATH"'

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: auto
          - os: ubuntu-24.04-arm
            arch: auto
          - os: macos-14
            arch: auto
          - os: windows-latest
            arch: auto
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install "cibuildwheel>=2.21,<3" "maturin>=1.7,<2"

      - name: Build wheels
        working-directory: packages/hedron-native
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hedron-native-wheels-${{ matrix.os }}
          path: packages/hedron-native/wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - name: Build sdist
        run: |
          uv build --package hedron-native --sdist --out-dir packages/hedron-native/dist

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hedron-native-sdist
          path: packages/hedron-native/dist/*.tar.gz
          if-no-files-found: error
