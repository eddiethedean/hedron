name: Release Edron

on:
  push:
    tags:
      - "edron-v*.*.*"

permissions:
  contents: read

concurrency:
  group: edron-release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.12.1"

jobs:
  test:
    name: Test Edron
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync locked workspace
        run: uv sync --locked --python 3.12

      - name: Run Edron regression tests
        run: >-
          uv run --python 3.12 pytest -q
          tests/unit/test_edron_phase05.py
          tests/unit/test_phase07_edron.py
          tests/unit/test_phase08_edron.py
          tests/unit/test_edron_phase09.py
          tests/unit/test_edron_phase09_packet.py
          tests/unit/test_edron_100_packet.py
          tests/upgrade/test_0_7_to_0_8_deployment.py
          tests/unit/test_edron_phase04.py
          tests/unit/test_edron_phase03.py
          tests/unit/test_edron_phase02.py
          tests/unit/test_edron_runtime.py
          tests/unit/test_edron_docs_checker.py
          tests/unit/test_hedron_import_surface.py
          tests/unit/test_package_metadata.py
          tests/ops/test_packaging_isolation.py::test_all_packages_declare_license_and_version

      - name: Lint Edron release surface
        run: >-
          uv run --python 3.12 ruff check
          packages/edron/src/edron
          scripts/check_edron_release.py
          scripts/verify_edron_phase08.py
          scripts/check_edron_09_release.py
          scripts/verify_edron_phase09.py
          scripts/check_edron_10_release.py
          scripts/verify_edron_100.py
          tests/unit/test_edron_phase05.py
          tests/unit/test_phase07_edron.py
          tests/unit/test_phase08_edron.py
          tests/upgrade/test_0_7_to_0_8_deployment.py
          tests/unit/test_edron_phase04.py
          tests/unit/test_edron_phase03.py
          tests/unit/test_edron_phase02.py
          tests/unit/test_package_metadata.py

      - name: Verify Edron 1.0 packet
        run: uv run --python 3.12 python scripts/verify_edron_100.py

  publish:
    name: Build and publish Edron
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag and package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^edron-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish from non-semver Edron tag: $TAG" >&2
            exit 1
          fi

          version="${TAG#edron-v}"
          package_file="packages/edron/pyproject.toml"
          if [ ! -f "$package_file" ]; then
            echo "Missing $package_file; Edron has not been added to the workspace yet." >&2
            exit 1
          fi

          read -r package_name package_version <<<"$(uv run --no-project --python 3.12 python -c '
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("packages/edron/pyproject.toml").read_text())["project"]
          print(project["name"], project["version"])
          ')"

          if [ "$package_name" != "edron" ]; then
            echo "Expected project name edron, found $package_name" >&2
            exit 1
          fi
          if [ "$package_version" != "$version" ]; then
            echo "Tag version $version does not match package version $package_version" >&2
            exit 1
          fi

          echo "Publishing edron==$package_version from $TAG"

      - name: Build Edron artifacts
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --package edron --out-dir dist
          ls -la dist
          VERSION="${GITHUB_REF_NAME#edron-v}"
          uv run --no-project --python 3.12 python scripts/check_edron_10_release.py \
            --dist-dir dist --version "${VERSION}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/edron-*.whl
            dist/edron-*.tar.gz

      - name: Publish Edron to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
