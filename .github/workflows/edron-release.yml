name: Release Edron

on:
  push:
    tags:
      - "edron-v*.*.*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable edron-v tag to recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: edron-release-${{ inputs.release_ref || github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_NO_SYNC: "1"
  UV_VERSION: "0.12.1"
  SOURCE_DATE_EPOCH: "315619200"
  PYTHONDONTWRITEBYTECODE: "1"
  RELEASE_REF: ${{ inputs.release_ref || github.ref }}
  RELEASE_TAG: ${{ inputs.release_ref || github.ref_name }}

jobs:
  publish:
    name: Build and publish Edron
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require successful CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/check_release_ci.sh

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync locked workspace
        run: uv sync --locked --python 3.12 --no-install-package hedron-native

      - name: Verify tag and package version
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^edron-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to publish from non-semver Edron tag: $TAG" >&2
            exit 1
          fi

          version="${TAG#edron-v}"
          package_file="packages/edron/pyproject.toml"
          if [ ! -f "$package_file" ]; then
            echo "Missing $package_file; Edron has not been added to the workspace yet." >&2
            exit 1
          fi

          read -r package_name package_version <<<"$(uv run --no-project --python 3.12 python -c '
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("packages/edron/pyproject.toml").read_text())["project"]
          print(project["name"], project["version"])
          ')"

          if [ "$package_name" != "edron" ]; then
            echo "Expected project name edron, found $package_name" >&2
            exit 1
          fi
          if [ "$package_version" != "$version" ]; then
            echo "Tag version $version does not match package version $package_version" >&2
            exit 1
          fi

          echo "Publishing edron==$package_version from $TAG"

      - name: Build Edron release artifacts
        run: |
          set -euo pipefail
          rm -rf dist
          uv build --package edron --out-dir dist
          uv build --package edron-sim --out-dir dist
          ls -la dist
          VERSION="${RELEASE_TAG#edron-v}"
          .venv/bin/python scripts/check_edron_10_release.py \
            --dist-dir dist --version "${VERSION}"
          .venv/bin/python scripts/verify_edron_release_artifacts.py \
            --dist-dir dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/edron-*.whl
            dist/edron-*.tar.gz
            dist/edron_sim-*.whl
            dist/edron_sim-*.tar.gz

      - name: Preflight published Stable dependencies from PyPI
        run: |
          set -euo pipefail
          uv venv .edron-release-preflight --python 3.12
          uv pip install --python .edron-release-preflight/bin/python \
            dist/edron-*.whl dist/edron_sim-*.whl
          .edron-release-preflight/bin/python -c \
            "import edron, edron_sim, hedron, hedron_data, hedron_charts, hedron_maps"

      - name: Publish Edron and edron-sim to PyPI
        if: github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Recover Edron and edron-sim publication
        if: github.event_name == 'workflow_dispatch'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_API_TOKEN secret is not set" >&2
            exit 1
          fi
          uv publish --token "$UV_PUBLISH_TOKEN" \
            --check-url https://pypi.org/simple/ \
            dist/edron-*.whl dist/edron-*.tar.gz \
            dist/edron_sim-*.whl dist/edron_sim-*.tar.gz

      - name: Verify the published Edron quick start
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#edron-v}"
          smoke_dir="$(mktemp -d)"
          for attempt in 1 2 3 4 5 6; do
            if uvx --refresh --from "edron==${VERSION}" edron new smoke \
              --path "${smoke_dir}/app" --template minimal --overwrite; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "Published edron==${VERSION} did not resolve from PyPI" >&2
              exit 1
            fi
            sleep 20
          done
          cd "${smoke_dir}/app"
          uv sync --no-install-project
          uv run --no-sync python -c \
            "import importlib.metadata as m; import app; assert m.version('edron') == '${VERSION}'; assert app.app"

      - name: Verify published edron-sim
        run: |
          set -euo pipefail
          SIM_VERSION="$(uv run --no-project --python 3.12 python -c '
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("packages/edron-sim/pyproject.toml").read_text())["project"]["version"])
          ')"
          smoke_dir="$(mktemp -d)"
          uv venv "${smoke_dir}/venv" --python 3.12
          for attempt in 1 2 3 4 5 6; do
            if uv pip install --refresh --python "${smoke_dir}/venv/bin/python" \
              "edron-sim==${SIM_VERSION}"; then
              break
            fi
            if [ "${attempt}" -eq 6 ]; then
              echo "Published edron-sim==${SIM_VERSION} did not resolve from PyPI" >&2
              exit 1
            fi
            sleep 20
          done
          "${smoke_dir}/venv/bin/python" -c \
            "import edron_sim; assert edron_sim.__version__ == '${SIM_VERSION}'"
