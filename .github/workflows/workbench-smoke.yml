name: Workbench smoke

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - "v0.30.*"

permissions:
  contents: read

concurrency:
  group: workbench-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realwb:
    name: REALWB-030
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync workspace
        run: uv sync --frozen --all-extras
      - name: Run Workbench Docker smoke (hedron-workbench + fastapi-workbench)
        env:
          PWB_LICENSE: ${{ secrets.PWB_LICENSE }}
          HEDRON_REALWB: "1"
        run: python scripts/check_realwb_smoke.py --live
      - name: Upload redacted RESULT.log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realwb-030-result
          path: docs/acceptance/realwb-030/RESULT.log
          if-no-files-found: ignore
