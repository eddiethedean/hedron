name: Release artifact rehearsal (1.3.0)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-artifacts-1.3.yml
      - .github/workflows/release.yml
      - docs/acceptance/RELEASE_1_3.md
      - docs/acceptance/release-gate-1.3.toml
      - docs/acceptance/ui-testing-*.toml
      - docs/implementation/UI_TESTING_1_3.md
      - packages/**
      - pyproject.toml
      - release/**
      - scripts/build_reproducible_release_artifacts.py
      - scripts/check_python_310_candidate.py
      - scripts/rehearse_python_311_upgrade_rollback.py
      - scripts/check_release_gate.py
      - scripts/verify_release_artifacts.py
      - scripts/verify_release_reproducibility.py
      - uv.lock

permissions:
  contents: read

concurrency:
  group: release-artifact-rehearsal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_NO_PROGRESS: "1"
  UV_VERSION: "0.12.1"
  SOURCE_DATE_EPOCH: "315619200"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  build-and-compare:
    name: Reproducible Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install compatibility interpreters
        run: uv python install 3.10 3.11
      - name: Verify the 1.3.0 package and candidate gate
        run: uv run --locked --python 3.12 python scripts/check_release_gate.py 1.3.0 --allow-planned
      - name: Build each coordinated package twice and verify hashes
        env:
          RETENTION_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >
          uv run --locked --python 3.12 python
          scripts/build_reproducible_release_artifacts.py
          dist/phase-130 --candidate-version 1.3.0
          --retention-reference "$RETENTION_REFERENCE"
      - name: Retain both builds and the hash ledger
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts-1.3.0-${{ github.run_id }}
          path: dist/phase-130/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
