name: Bug report
description: Report incorrect behavior in a published Hedron package
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For public API / Supported-claim changes, prefer an RFC discussion instead.
  - type: input
    id: version
    attributes:
      label: Hedron version
      description: Output of `python -c "import hedron; print(hedron.__version__)"`
      placeholder: "0.11.0"
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Primary package
      options:
        - hedron
        - hedron-core
        - hedron-flask
        - hedron-django
        - hedron-data
        - hedron-charts
        - hedron-jinja
        - hedron-explorer
        - docs / other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Prefer a short app.py or pytest snippet.
    validations:
      required: true
