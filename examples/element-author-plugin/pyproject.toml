[project]
name = "element-author-plugin"
version = "0.1.0"
description = "External Hedron element plugin consumer for PLUGIN-040"
requires-python = ">=3.11,<3.15"
dependencies = [
    "hedron-core>=0.44.0,<0.45",
]

[project.entry-points."hedron.plugins"]
element_author_plugin = "element_author_plugin.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/element_author_plugin"]
