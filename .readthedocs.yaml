# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Override html build so Material's MkDocs 2.0 advisory is silenced (stderr noise).
    build:
      html:
        - NO_MKDOCS_2_WARNING=1 mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements-rtd.txt
