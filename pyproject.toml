[project]
name = "hedron-workspace"
version = "0.4.0"
description = "Hedron monorepo workspace"
requires-python = ">=3.11,<3.15"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/hedron-core",
    "packages/hedron",
    "packages/hedron-explorer",
    "packages/hedron-sample-kit",
]

[dependency-groups]
dev = [
    "hedron-core",
    "hedron",
    "hedron-explorer",
    "hedron-sample-kit",
    "pytest>=8.3",
    "httpx>=0.28",
    "anyio>=4.8",
    "syrupy>=4.8",
    "ruff>=0.11",
    "pyright>=1.1.400",
]

[tool.uv.sources]
hedron-core = { workspace = true }
hedron = { workspace = true }
hedron-explorer = { workspace = true }
hedron-sample-kit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
markers = [
    "security: adversarial security corpus",
    "a11y: accessibility core checks",
    "performance: non-blocking benchmark foundations",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages/hedron-core/src", "packages/hedron/src", "packages/hedron-explorer/src", "packages/hedron-sample-kit/src", "tests", "examples"]
extend-exclude = ["docs", "archive", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["B008"]
"packages/hedron-core/src/hedron_core/addressable.py" = ["UP047"]
"packages/hedron/src/hedron/async_utils.py" = ["UP047"]
"packages/hedron/src/hedron/state.py" = ["UP046", "UP047"]

[tool.pyright]
include = [
    "packages/hedron-core/src",
    "packages/hedron/src",
    "packages/hedron-explorer/src",
    "packages/hedron-sample-kit/src",
]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportPrivateUsage = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnusedFunction = "warning"
reportDeprecated = "warning"
reportInvalidTypeVarUse = "warning"
reportIncompatibleVariableOverride = "warning"
