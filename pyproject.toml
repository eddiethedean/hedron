[project]
name = "hedron-workspace"
version = "1.0.8"
description = "Hedron monorepo workspace"
requires-python = ">=3.10,<3.15"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/hedron-core",
    "packages/hedron",
    "packages/hedron-explorer",
    "packages/hedron-sample-kit",
    "packages/hedron-data",
    "packages/hedron-charts",
    "packages/hedron-maps",
    "packages/hedron-flask",
    "packages/hedron-django",
    "packages/hedron-jinja",
    "packages/hedron-conformance",
    "packages/hedron-native",
    "packages/hedron-extras",
    "packages/hedron-notebook",
    "packages/hedron-mcp",
    "packages/hedron-gradio",
    "packages/hedron-sim",
    "packages/hedron-posit",
    "packages/hedron-elements",
    "packages/hedron-docs",
    "packages/edron",
    "packages/edron-sim",
    "packages/fastapi-workbench",
]

[dependency-groups]
dev = [
    "hedron-core",
    "hedron",
    "hedron-explorer",
    "hedron-sample-kit",
    "hedron-data",
    "hedron-charts",
    "hedron-maps",
    "hedron-flask",
    "hedron-django",
    "hedron-jinja",
    "hedron-conformance",
    "hedron-native",
    "hedron-extras",
    "hedron-notebook",
    "hedron-mcp",
    "hedron-gradio",
    "hedron-sim",
    "hedron-posit",
    "hedron-elements",
    "hedron-docs",
    "edron",
    "edron-sim",
    "fastapi-workbench",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "pytest-cov>=7.0",
    # Pyright analyzes the declared Python 3.10 floor even when CI runs on a
    # newer interpreter, so its environment must resolve the 3.10 TOML branch.
    "tomli>=2.0.1",
    "httpx>=0.28",
    "anyio>=4.8",
    "syrupy>=4.8",
    "ruff>=0.11",
    "pyright>=1.1.400",
    "matplotlib>=3.8,<4",
    "nh3>=0.2",
    "markdown>=3.5",
    "pygments>=2.17",
    "pillow>=10.0",
    "email-validator>=2.0",
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.22",
    "authlib>=1.3",
    "flask>=3,<4",
    "flask-login>=0.6,<0.7",
    "django>=5.2,<6",
    "django-stubs>=5.2,<6",
    "waitress>=3,<4",
    "streamlit>=1.59.1",
    "pandas>=2.2",
    "pyarrow>=18,<25",
    "dask[dataframe]>=2024.1",
    "playwright>=1.62.0",
    "uvicorn>=0.52.1",
    "axe-playwright-python>=0.1.8",
]
docs = [
    "mkdocs>=1.6,<2",
    # 9.7.7 contains the search-suggestion XSS fix; keep the docs lane on the
    # patched 9.7 release while avoiding an unreviewed major-version change.
    "mkdocs-material>=9.7.7,<9.8",
    "pymdown-extensions>=11.0,<12",
    "mkdocstrings[python]>=0.27,<0.31",
    "hedron-sim",
    "edron-sim",
]

[tool.uv.sources]
hedron-core = { workspace = true }
hedron = { workspace = true }
hedron-explorer = { workspace = true }
hedron-sample-kit = { workspace = true }
hedron-data = { workspace = true }
hedron-charts = { workspace = true }
hedron-maps = { workspace = true }
hedron-flask = { workspace = true }
hedron-django = { workspace = true }
hedron-jinja = { workspace = true }
hedron-conformance = { workspace = true }
hedron-native = { workspace = true }
hedron-extras = { workspace = true }
hedron-notebook = { workspace = true }
hedron-mcp = { workspace = true }
hedron-gradio = { workspace = true }
hedron-sim = { workspace = true }
hedron-posit = { workspace = true }
hedron-elements = { workspace = true }
hedron-docs = { workspace = true }
edron = { workspace = true }
edron-sim = { workspace = true }
fastapi-workbench = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "-n", "auto", "--dist=loadfile"]
markers = [
    "security: adversarial security corpus",
    "a11y: accessibility core checks",
    "performance: non-blocking benchmark foundations",
    "browser: optional Playwright Chromium evidence (HEDRON_BROWSER=1)",
    "redis: opt-in tests against a real Redis server (HEDRON_REDIS_URL)",
    "historical_0x: reviewed pre-1.0 API fixture retained for retirement tracking",
]

[tool.coverage.run]
branch = true
source = ["hedron", "hedron_core"]

[tool.coverage.report]
fail_under = 73
precision = 2
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["packages/hedron-core/src", "packages/hedron/src", "packages/hedron-explorer/src", "packages/hedron-sample-kit/src", "packages/hedron-data/src", "packages/hedron-charts/src", "packages/hedron-maps/src", "packages/hedron-flask/src", "packages/hedron-django/src", "packages/hedron-jinja/src", "packages/hedron-conformance/src", "packages/hedron-native/src", "packages/hedron-extras/src", "packages/hedron-notebook/src", "packages/hedron-mcp/src", "packages/hedron-gradio/src", "packages/hedron-sim/src", "packages/hedron-posit/src", "packages/hedron-elements/src", "packages/hedron-docs/src", "packages/edron/src", "packages/edron-sim/src", "packages/fastapi-workbench/src", "tests", "examples"]
extend-exclude = ["docs", "archive", "dist", ".venv", ".bug_hunt_repros"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF100", "RUF012", "S110", "S112", "BLE001", "ASYNC", "PTH", "DTZ", "RET"]

[tool.ruff.lint.isort]
# Tests import the Python 3.10 tomli alias under the stdlib module name.
extra-standard-library = ["tomllib"]

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["B008"]
"packages/hedron-core/src/hedron_core/addressable.py" = ["UP047"]
"packages/hedron/src/hedron/async_utils.py" = ["UP047"]
"packages/hedron/src/hedron/state.py" = ["UP046", "UP047"]
"packages/hedron-data/src/hedron_data/spreadsheet.py" = ["E501"]
"tests/upgrade/phase_1_0/negative/*.py" = ["B009", "F821"]
"tests/upgrade/phase_1_0/transitional/*.py" = ["F821"]

[tool.pyright]
include = [
    "packages/hedron-core/src",
    "packages/hedron/src",
    "packages/hedron-explorer/src",
    "packages/hedron-sample-kit/src",
    "packages/hedron-data/src",
    "packages/hedron-charts/src",
    "packages/hedron-maps/src",
    "packages/hedron-flask/src",
    "packages/hedron-django/src",
    "packages/hedron-jinja/src",
    "packages/hedron-conformance/src",
    "packages/hedron-native/src",
    "packages/hedron-extras/src",
    "packages/hedron-notebook/src",
    "packages/hedron-mcp/src",
    "packages/hedron-gradio/src",
    "packages/hedron-sim/src",
    "packages/hedron-posit/src",
    "packages/hedron-elements/src",
    "packages/hedron-docs/src",
    "packages/edron/src",
    "packages/edron-sim/src",
    "packages/fastapi-workbench/src",
]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
extraPaths = [
    "packages/hedron-core/src",
    "packages/hedron/src",
    "packages/hedron-explorer/src",
    "packages/hedron-sample-kit/src",
    "packages/hedron-data/src",
    "packages/hedron-charts/src",
    "packages/hedron-maps/src",
    "packages/hedron-flask/src",
    "packages/hedron-django/src",
    "packages/hedron-jinja/src",
    "packages/hedron-conformance/src",
    "packages/hedron-native/src",
    "packages/hedron-extras/src",
    "packages/hedron-notebook/src",
    "packages/hedron-mcp/src",
    "packages/hedron-gradio/src",
    "packages/hedron-sim/src",
    "packages/hedron-posit/src",
    "packages/hedron-elements/src",
    "packages/hedron-docs/src",
    "packages/edron/src",
    "packages/edron-sim/src",
    "packages/fastapi-workbench/src",
]
typeCheckingMode = "strict"
reportMissingTypeStubs = "none"
reportPrivateUsage = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownMemberType = "warning"
reportUnknownParameterType = "warning"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryComparison = "warning"
reportUnusedFunction = "warning"
reportDeprecated = "warning"
reportInvalidTypeVarUse = "warning"
reportIncompatibleVariableOverride = "warning"
