site_name: Edron + Hedron
site_description: Build complete server-rendered Python applications with Edron or compose FastAPI-native interfaces with Hedron.
site_author: Odos Matthews
repo_url: https://github.com/eddiethedean/hedron
repo_name: eddiethedean/hedron
edit_uri: edit/v1.0/docs/
docs_dir: docs
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://hedron.readthedocs.io/en/latest/"]

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/hedron-mark.svg
  favicon: assets/hedron-mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
          paths:
            - packages/edron/src
            - packages/hedron/src
            - packages/hedron-core/src
            - packages/hedron-flask/src
            - packages/hedron-django/src
            - packages/hedron-posit/src

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  requirements-rtd.txt
  overrides/**
  archive/**
  rfcs/**
  acceptance/**
  foundations/01_VISION.md
  foundations/02_PHILOSOPHY.md
  foundations/03_DESIGN_PRINCIPLES.md
  foundations/README.md
  implementation/**
  /STATUS.md
  /ROADMAP.md
  /RELEASE.md
  /DECISIONS.md
  /SPECIFICATION.md
  /ENGINEERING_BASELINE.md
  /PROJECT_LAYOUT.md
  /DIAGNOSTICS.md
  /IDENTIFIERS.md
  /REFERENCE_APPLICATION.md
  /INFERENCE_OVERRIDES.md
  guides/feature-research.md
  STREAMLIT_FEATURE_CROSSCHECK.md
  STREAMLIT_EXTRAS_FEATURE_CROSSCHECK.md
  NICEGUI_FEATURE_CROSSCHECK.md
  PLOTLY_DASH_FEATURE_CROSSCHECK.md
  GRADIO_FEATURE_CROSSCHECK.md
  ACCESSIBILITY_FEATURE_RESEARCH.md
  DJANGO_ADAPTER_RESEARCH.md
  FLASK_ADAPTER_RESEARCH.md
  HTMX_2_AUDIT.md
  HTMX_2_EXTENSIONS.md
  READINESS_REPORT.md
  TRACEABILITY.md
  guides/maintainer-handbook.md
  guides/maintainers.md
  guides/evidence-pack.md
  guides/production-quality.md
  guides/production-readiness.md
  guides/ship-to-production.md
  guides/training-streamlit-to-hedron-posit.md
  examples/phase-evidence.md


validation:
  nav:
    # The sidebar is intentionally task-oriented. Detailed API/component pages
    # remain built, searchable, and linkable without crowding navigation.
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_javascript:
  - javascript/readthedocs.js
  - javascript/examples.js
  - javascript/component-demos.js
  - javascript/hedron-sim.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/component-demos.css
  - stylesheets/styling-guide.css
  - stylesheets/hello-refresh.css
  - stylesheets/hedron-default.css
  - stylesheets/hedron-sim.css

extra:
  generator: false
  status:
    new: New
    stable: Stable
    shipped: Shipped
    experimental: Experimental
    beta: Beta
    deferred: Deferred
    planned: Planned
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eddiethedean/hedron
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/hedron/
      name: Hedron on PyPI

