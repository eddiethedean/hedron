site_name: Hedron
site_description: Build typed, server-rendered Python applications with FastAPI, HTML, and HTMX—without a frontend build chain.
site_author: Odos Matthews
repo_url: https://github.com/eddiethedean/hedron
repo_name: eddiethedean/hedron
edit_uri: edit/main/docs/
docs_dir: docs
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://hedron.readthedocs.io/en/latest/"]

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/hedron-mark.svg
  favicon: assets/hedron-mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
          paths:
            - packages/hedron/src
            - packages/hedron-core/src
            - packages/hedron-flask/src
            - packages/hedron-django/src

hooks:
  - docs/hooks.py

exclude_docs: |
  hooks.py
  requirements-rtd.txt
  overrides/**
  archive/**
  rfcs/**
  acceptance/**
  foundations/**
  implementation/**
  /ROADMAP.md
  /STATUS.md
  /RELEASE.md
  /DECISIONS.md
  /SPECIFICATION.md
  /ENGINEERING_BASELINE.md
  /PROJECT_LAYOUT.md
  /DIAGNOSTICS.md
  /IDENTIFIERS.md
  /PERFORMANCE_BUDGETS.md
  /REFERENCE_APPLICATION.md
  /INFERENCE_OVERRIDES.md
  guides/feature-research.md
  STREAMLIT_FEATURE_CROSSCHECK.md
  STREAMLIT_EXTRAS_FEATURE_CROSSCHECK.md
  PLOTLY_DASH_FEATURE_CROSSCHECK.md
  GRADIO_FEATURE_CROSSCHECK.md
  ACCESSIBILITY_FEATURE_RESEARCH.md
  DJANGO_ADAPTER_RESEARCH.md
  FLASK_ADAPTER_RESEARCH.md
  HTMX_2_AUDIT.md
  HTMX_2_EXTENSIONS.md
  READINESS_REPORT.md
  TRACEABILITY.md


validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascript/readthedocs.js
  - javascript/examples.js
  - javascript/component-demos.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/component-demos.css

extra:
  generator: false
  status:
    new: New
    stable: Stable
    shipped: Shipped in 0.11
    planned: Planned
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eddiethedean/hedron
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/hedron/
      name: Hedron on PyPI

copyright: Copyright &copy; 2026 Odos Matthews · Released under the MIT License

