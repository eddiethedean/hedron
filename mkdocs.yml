site_name: Hedron
site_description: Typed, server-rendered component applications with FastAPI, HTML, and HTMX.
site_author: Odos Matthews
repo_url: https://github.com/eddiethedean/hedron
repo_name: eddiethedean/hedron
edit_uri: edit/main/docs/
docs_dir: docs
site_url: !ENV [READTHEDOCS_CANONICAL_URL, "https://hedron.readthedocs.io/"]

theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

hooks:
  - docs/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascript/readthedocs.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eddiethedean/hedron
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/hedron/

